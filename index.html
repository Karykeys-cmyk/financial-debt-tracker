  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = "finansovyy-uchet-data";
    const SYNC_KEY = "finansovyy-uchet-sync";
    const DEFAULT_SYNC_URL = "https://sqsnhapkgtdjjkiexfrn.supabase.co";
    const DEFAULT_SYNC_KEY = "sb_publishable_2wQo7nf5W4eBQmiPorV9Kg_u-gjFYb-";
    const SYNC_SQL = `create table if not exists public.finance_state (
  id text primary key,
  payload jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.finance_state enable row level security;
drop policy if exists finance_state_public on public.finance_state;
create policy finance_state_public on public.finance_state
  for all using (true) with check (true);
grant all on table public.finance_state to anon, authenticated, public;`;
    const MONTHS = [
      "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
      "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];
    const SPECIAL = {
      "Даня": { hasRental: true, hasDtf: true, hasInvoices: true },
      "Максюшка": { hasRental: true, hasDtf: false, hasInvoices: true }
    };
    const RENTAL_SUBS = ["Коммуналка", "Аренда"];
    const PAYMENT_METHODS = [
      "Наличные",
      "Перевод",
      "На счёт юрлица",
      "Безналичный расчёт",
      "Услугами",
      "Товарами",
      "Взаимозачёт",
      "Другое"
    ];

    const state = {
      view: "home",
      contractor: null,
      tab: "rental",
      subTab: "Коммуналка",
      paymentFilter: "Все",
      recordSearch: "",
      recordsCollapsed: false,
      periodMode: "all",
      periodYear: String(new Date().getFullYear()),
      periodMonth: String(new Date().getMonth() + 1),
      editingId: null,
      recordType: "Дебет",
      loanSide: "out",
      workTab: "debt",
      repayTargetId: null,
      pendingDelete: null
    };

    function contractorConfig(name) {
      return SPECIAL[name] || { hasRental: false, hasDtf: false, hasInvoices: false };
    }

    function migrateRecord(record) {
      const r = { ...record };
      if (r.category === "Аренда помещения" && r.subCategory === "Аренда ДТФ") {
        r.category = "Аренда ДТФ";
        r.subCategory = null;
      } else if (r.category === "Аренда помещения" && r.subCategory === "Счета") {
        r.category = "Счета";
        r.subCategory = null;
      }
      if (r.category === "Деньги в долг" && r.loanSide !== "in") r.loanSide = "out";
      if (!Array.isArray(r.payments)) r.payments = [];
      return r;
    }

    function paymentSum(record) {
      return (record.payments || []).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
    }

    function remainingOf(record) {
      return Math.round(((Number(record.amount) || 0) - paymentSum(record)) * 100) / 100;
    }

    function isFullyPaid(record) {
      return remainingOf(record) <= 0.009;
    }

    function debtGroupKey(record) {
      if (record.category === "Деньги в долг") return "loan:" + (record.loanSide === "in" ? "in" : "out");
      return String(record.category || "") + ":" + String(record.subCategory || "");
    }

    function asPayment(record) {
      return {
        id: record.id,
        date: record.date || record.issueDate || todayIso(),
        amount: Number(record.amount) || 0,
        paymentMethod: record.paymentMethod || "",
        comment: record.comment || ""
      };
    }

    function migrateContractorRecords(records, deletedRecordIds, deletedPaymentIds) {
      const deletedPays = new Set(deletedPaymentIds || []);
      const list = (records || []).map(migrateRecord);
      list.forEach((r) => {
        r.payments = (r.payments || []).filter((p) => p && p.id && !deletedPays.has(p.id));
      });
      const credits = list
        .filter((r) => r.type === "Кредит")
        .slice()
        .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.id || "").localeCompare(b.id || ""));
      const debts = list.filter((r) => r.type !== "Кредит");
      if (credits.length) {
        const groups = new Map();
        debts.forEach((d) => {
          const key = debtGroupKey(d);
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(d);
        });
        credits.forEach((credit) => {
          if (!credit.id) return;
          const pool = groups.get(debtGroupKey(credit)) || [];
          let target = pool.find((d) => remainingOf(d) > 0.009);
          if (!target) target = pool[pool.length - 1];
          if (!target) target = debts.find((d) => remainingOf(d) > 0.009) || debts[debts.length - 1];
          if (target && !target.payments.some((p) => p.id === credit.id) && !deletedPays.has(credit.id)) {
            target.payments.push(asPayment(credit));
          }
          if (!deletedRecordIds.includes(credit.id)) deletedRecordIds.push(credit.id);
        });
      }
      return debts;
    }

    function migrateDb(data) {
      if (!data.contractors) data.contractors = {};
      if (!Array.isArray(data.deletedRecordIds)) data.deletedRecordIds = [];
      if (!Array.isArray(data.deletedPaymentIds)) data.deletedPaymentIds = [];
      if (!Array.isArray(data.deletedContractorNames)) data.deletedContractorNames = [];
      Object.keys(data.contractors).forEach((name) => {
        const contractor = data.contractors[name] || { records: [] };
        contractor.records = migrateContractorRecords(
          contractor.records,
          data.deletedRecordIds,
          data.deletedPaymentIds
        );
        data.contractors[name] = contractor;
      });
      return data;
    }

    function defaultData() {
      return {
        contractors: {
          "Даня": { records: [] },
          "Максюшка": { records: [] }
        },
        deletedRecordIds: [],
        deletedPaymentIds: [],
        deletedContractorNames: []
      };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : defaultData();
        if (!data.contractors) data.contractors = {};
        if (!Array.isArray(data.deletedContractorNames)) data.deletedContractorNames = [];
        const removed = new Set(data.deletedContractorNames);
        if (!removed.has("Даня") && !data.contractors["Даня"]) data.contractors["Даня"] = { records: [] };
        if (!removed.has("Максюшка") && !data.contractors["Максюшка"]) data.contractors["Максюшка"] = { records: [] };
        Object.keys(data.contractors).forEach((name) => {
          if (removed.has(name)) delete data.contractors[name];
        });
        return migrateDb(data);
      } catch (err) {
        return defaultData();
      }
    }

    function saveData(data, options) {
      data.updatedAt = Date.now();
      if (!Array.isArray(data.deletedRecordIds)) data.deletedRecordIds = [];
      if (!Array.isArray(data.deletedPaymentIds)) data.deletedPaymentIds = [];
      if (!Array.isArray(data.deletedContractorNames)) data.deletedContractorNames = [];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (!options || !options.skipRemote) schedulePush();
    }

    let db = loadData();
    if (!Array.isArray(db.deletedRecordIds)) db.deletedRecordIds = [];
    if (!Array.isArray(db.deletedPaymentIds)) db.deletedPaymentIds = [];
    if (!Array.isArray(db.deletedContractorNames)) db.deletedContractorNames = [];
    saveData(db, { skipRemote: true });

    const syncState = { status: "busy", message: "Подключение к облаку…" };

    function getSyncConfig() {
      try {
        const raw = localStorage.getItem(SYNC_KEY);
        const cfg = raw ? JSON.parse(raw) : {};
        return {
          url: (cfg.url || DEFAULT_SYNC_URL).replace(/\/$/, ""),
          key: cfg.key || DEFAULT_SYNC_KEY
        };
      } catch (err) {
        return { url: DEFAULT_SYNC_URL, key: DEFAULT_SYNC_KEY };
      }
    }

    function setSyncConfig(cfg) {
      localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
      supabaseClient = null;
    }

    let supabaseClient = null;

    function getSupabase() {
      const { url, key } = getSyncConfig();
      if (!url || !key) return null;
      if (!window.supabase || !window.supabase.createClient) {
        throw new Error("Клиент Supabase не загрузился. Проверьте интернет.");
      }
      if (!supabaseClient) supabaseClient = window.supabase.createClient(url, key);
      return supabaseClient;
    }

    function formatSupabaseError(error) {
      const text = [error?.message, error?.hint, error?.code].filter(Boolean).join(" ");
      if (/finance_state/i.test(text) && /schema cache|does not exist|PGRST205/i.test(text)) {
        return "Таблица finance_state не найдена. Выполните SQL из настроек.";
      }
      return error?.message || text || "Ошибка облака";
    }

    function setSyncStatus(status, message) {
      syncState.status = status;
      syncState.message = message;
      const el = document.getElementById("sync-status");
      if (!el) return;
      el.className = "sync-status " + status;
      el.textContent = message;
    }

    function mergeFinanceData(local, remote) {
      const out = defaultData();
      const deleted = new Set([...(local.deletedRecordIds || []), ...(remote.deletedRecordIds || [])]);
      const deletedPays = new Set([...(local.deletedPaymentIds || []), ...(remote.deletedPaymentIds || [])]);
      const deletedNames = new Set([...(local.deletedContractorNames || []), ...(remote.deletedContractorNames || [])]);
      const names = new Set([
        ...Object.keys(local.contractors || {}),
        ...Object.keys(remote.contractors || {})
      ]);
      names.forEach((name) => {
        if (deletedNames.has(name)) return;
        const map = new Map();
        const remoteList = remote.contractors?.[name]?.records || [];
        const localList = local.contractors?.[name]?.records || [];
        remoteList.concat(localList).forEach((rec) => {
          if (!rec || !rec.id || deleted.has(rec.id)) return;
          const incoming = migrateRecord(rec);
          incoming.payments = (incoming.payments || []).filter((p) => p && p.id && !deletedPays.has(p.id));
          const existing = map.get(incoming.id);
          if (!existing) {
            map.set(incoming.id, incoming);
            return;
          }
          const pmap = new Map();
          [...(existing.payments || []), ...(incoming.payments || [])].forEach((p) => {
            if (p && p.id && !deletedPays.has(p.id)) pmap.set(p.id, p);
          });
          map.set(incoming.id, { ...incoming, payments: [...pmap.values()] });
        });
        out.contractors[name] = { records: [...map.values()] };
      });
      if (!deletedNames.has("Даня") && !out.contractors["Даня"]) out.contractors["Даня"] = { records: [] };
      if (!deletedNames.has("Максюшка") && !out.contractors["Максюшка"]) out.contractors["Максюшка"] = { records: [] };
      out.deletedRecordIds = [...deleted];
      out.deletedPaymentIds = [...deletedPays];
      out.deletedContractorNames = [...deletedNames];
      out.updatedAt = Date.now();
      return migrateDb(out);
    }

    async function fetchRemote() {
      const client = getSupabase();
      if (!client) return null;
      const { data, error } = await client
        .from("finance_state")
        .select("payload,updated_at")
        .eq("id", "main")
        .maybeSingle();
      if (error) throw new Error(formatSupabaseError(error));
      return data;
    }

    async function pushRemote() {
      const client = getSupabase();
      if (!client) return;
      setSyncStatus("busy", "Сохранение в облако…");
      const { error } = await client.from("finance_state").upsert({
        id: "main",
        payload: db,
        updated_at: new Date().toISOString()
      });
      if (error) throw new Error(formatSupabaseError(error));
      setSyncStatus("ok", "Синхронизировано с облаком");
    }

    let pushTimer = null;
    function schedulePush() {
      if (!getSyncConfig().key) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => {
        pushRemote().catch((err) => setSyncStatus("error", err.message || "Ошибка синхронизации"));
      }, 400);
    }

    async function syncNow() {
      const { key } = getSyncConfig();
      if (!key) {
        setSyncStatus("off", "Синхронизация не настроена");
        openSyncModal();
        return;
      }
      setSyncStatus("busy", "Синхронизация…");
      try {
        const remote = await fetchRemote();
        if (remote && remote.payload) {
          db = mergeFinanceData(db, remote.payload);
          saveData(db, { skipRemote: true });
          render();
        }
        await pushRemote();
        showToast("Данные синхронизированы");
      } catch (err) {
        setSyncStatus("error", err.message || "Ошибка синхронизации");
        showToast("Не удалось синхронизировать");
      }
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMoney(amount) {
      const n = Number(amount) || 0;
      return n.toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " ₽";
    }

    function formatDate(iso) {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      if (!y || !m || !d) return iso;
      return d + "." + m + "." + y;
    }

    function daysBetween(from, to) {
      const a = new Date(from + "T00:00:00");
      const b = new Date(to + "T00:00:00");
      if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return 0;
      return Math.round((b - a) / 86400000);
    }

    function calcProfit(amount, rate, issueDate, returnDate) {
      const sum = Number(amount) || 0;
      const interest = Number(rate) || 0;
      if (!interest || !issueDate) return 0;
      const end = returnDate || todayIso();
      const days = daysBetween(issueDate, end);
      if (days <= 0) return 0;
      return (sum * interest / 100) * (days / 365);
    }

    function todayIso() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function contractorNames() {
      const names = Object.keys(db.contractors || {});
      const special = ["Даня", "Максюшка"].filter((name) => names.includes(name));
      const extras = names
        .filter((name) => name !== "Даня" && name !== "Максюшка")
        .sort((a, b) => a.localeCompare(b, "ru"));
      return [...special, ...extras];
    }

    function currentRecords() {
      return db.contractors[state.contractor]?.records || [];
    }

    function recordYearMonth(record) {
      if (record.year) {
        const monthName = String(record.month || "").split(" ")[0];
        const monthIndex = MONTHS.indexOf(monthName);
        if (monthIndex >= 0) return { year: Number(record.year), month: monthIndex + 1 };
      }
      const iso = record.date || record.issueDate;
      if (!iso || !/^\d{4}-\d{2}/.test(iso)) return null;
      return { year: Number(iso.slice(0, 4)), month: Number(iso.slice(5, 7)) };
    }

    function inSelectedPeriod(record) {
      if (state.periodMode === "all") return true;
      const ym = recordYearMonth(record);
      if (!ym) return false;
      if (Number(ym.year) !== Number(state.periodYear)) return false;
      if (state.periodMode === "month" && Number(ym.month) !== Number(state.periodMonth)) return false;
      return true;
    }

    function debtRecords(name) {
      return (db.contractors[name]?.records || []).filter((r) => r.type !== "Кредит");
    }

    function totals(name, usePeriod) {
      const records = debtRecords(name);
      let debit = 0;
      let credit = 0;
      records.forEach((r) => {
        if (isBorrowed(r)) return;
        if (!usePeriod || inSelectedPeriod(r)) debit += Number(r.amount) || 0;
        (r.payments || []).forEach((p) => {
          if (usePeriod && !inSelectedPeriod(p)) return;
          credit += Number(p.amount) || 0;
        });
      });
      return { debit, credit, saldo: debit - credit };
    }

    function debitBreakdown(name, usePeriod) {
      let records = debtRecords(name);
      if (usePeriod) records = records.filter(inSelectedPeriod);
      const add = (pred) => records.reduce((sum, r) => pred(r) ? sum + (Number(r.amount) || 0) : sum, 0);
      const rentOnly = add((r) => r.category === "Аренда помещения" && r.subCategory === "Аренда");
      const utilities = add((r) => r.category === "Аренда помещения" && r.subCategory === "Коммуналка");
      const dtf = add((r) => r.category === "Аренда ДТФ");
      const cash = add((r) => r.category === "Деньги в долг" && r.loanSide !== "in");
      const invoices = add((r) => r.category === "Счета");
      if (name === "Даня") {
        return { rent: rentOnly + utilities, dtf, cash, invoices };
      }
      return { rent: rentOnly + dtf, utilities, cash, invoices };
    }

    function periodYears() {
      const years = new Set();
      const now = new Date().getFullYear();
      for (let y = 2020; y <= Math.max(now, 2030); y++) years.add(y);
      currentRecords().forEach((r) => {
        const ym = recordYearMonth(r);
        if (ym && ym.year) years.add(ym.year);
      });
      return [...years].sort((a, b) => b - a);
    }

    function periodRangeLabel() {
      if (state.periodMode === "year") return String(state.periodYear);
      if (state.periodMode === "month") {
        const monthName = MONTHS[Number(state.periodMonth) - 1] || "";
        return `${monthName} ${state.periodYear}`;
      }
      const dates = currentRecords()
        .map((r) => r.date || r.issueDate)
        .filter((d) => d && /^\d{4}-\d{2}-\d{2}$/.test(d))
        .sort();
      if (!dates.length) return "с начала задолженностей по текущую дату";
      return `с ${formatDate(dates[0])} по ${formatDate(todayIso())}`;
    }

    function debitBreakdownRows(name, split) {
      if (name === "Даня") {
        return [
          ["Всего за аренду", split.rent],
          ["Всего Аренда ДТФ", split.dtf],
          ["Всего отдано", split.cash],
          ["По счетам", split.invoices]
        ];
      }
      return [
        ["Всего за аренду", split.rent],
        ["Коммуналка", split.utilities],
        ["Всего по наличным", split.cash],
        ["По счетам", split.invoices]
      ];
    }

    function isBorrowed(r) {
      return r && r.category === "Деньги в долг" && r.loanSide === "in";
    }

    function recordTypeLabel(r) {
      if (isFullyPaid(r)) return "Погашен";
      if (isBorrowed(r)) return "Наш долг";
      if (r.category === "Деньги в долг") return "Выдали";
      return "Долг";
    }

    function interestProfit(name) {
      return debtRecords(name)
        .filter((r) => r.category === "Деньги в долг" && r.loanSide !== "in")
        .reduce((sum, r) => sum + (Number(r.profit) || 0), 0);
    }

    function interestLoss(name) {
      return debtRecords(name)
        .filter((r) => isBorrowed(r))
        .reduce((sum, r) => sum + (Number(r.profit) || 0), 0);
    }

    function ourDebt(name) {
      return debtRecords(name)
        .filter(isBorrowed)
        .reduce((sum, r) => sum + Math.max(0, remainingOf(r)), 0);
    }

    function globalDebtAndProfit() {
      let debt = 0;
      let profit = 0;
      let ours = 0;
      let loss = 0;
      contractorNames().forEach((name) => {
        debt += totals(name).saldo;
        profit += interestProfit(name);
        ours += ourDebt(name);
        loss += interestLoss(name);
      });
      return { debt, profit, ours, loss };
    }

    function overdueLoanIds(name) {
      const today = todayIso();
      const overdue = new Set();
      debtRecords(name).forEach((r) => {
        if (r.category !== "Деньги в долг" || r.loanSide === "in") return;
        if (isFullyPaid(r)) return;
        if (r.returnDate && r.returnDate < today) overdue.add(r.id);
      });
      return overdue;
    }

    function hasOverdueDebt(name) {
      return overdueLoanIds(name).size > 0;
    }

    function saldoTone(amount) {
      if (amount > 0) return "positive";
      if (amount < 0) return "negative";
      return "zero";
    }

    function isPaidTab() {
      return state.tab === "paid";
    }

    function workTabId() {
      if (!isPaidTab()) return state.tab;
      return state.workTab || (contractorConfig(state.contractor).hasRental ? "rental" : "debt");
    }

    function currentCategory() {
      const tab = workTabId();
      if (tab === "dtf") return "Аренда ДТФ";
      if (tab === "invoices") return "Счета";
      if (tab === "debt") return "Деньги в долг";
      return "Аренда помещения";
    }

    function recordMatchesSearch(r, q) {
      if (!q) return true;
      const payText = (r.payments || []).map((p) => [
        p.date, formatDate(p.date), p.amount, formatMoney(p.amount), p.paymentMethod, p.comment
      ].join(" ")).join(" ");
      const hay = [
        r.date, r.issueDate, r.returnDate,
        formatDate(r.date), formatDate(r.issueDate), formatDate(r.returnDate),
        r.category, r.subCategory, r.type, recordTypeLabel(r),
        r.comment, r.invoiceNumber, r.month,
        r.amount, formatMoney(r.amount), formatMoney(r.profit),
        formatMoney(remainingOf(r)), formatMoney(paymentSum(r)),
        "остаток", "погашен", "выплата",
        isBorrowed(r) ? "взяли наш долг без срока" : "",
        r.loanSide === "out" ? "выдали" : "",
        payText
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function paidCount(name) {
      return debtRecords(name).filter(isFullyPaid).length;
    }

    function availableCategories(name) {
      const cfg = contractorConfig(name);
      const cats = [];
      if (cfg.hasRental) cats.push("Аренда помещения");
      if (cfg.hasDtf) cats.push("Аренда ДТФ");
      if (cfg.hasInvoices) cats.push("Счета");
      cats.push("Деньги в долг");
      return cats;
    }

    function matchesWorkCategory(r) {
      const tab = workTabId();
      if (tab === "rental") return r.category === "Аренда помещения" && r.subCategory === state.subTab;
      return r.category === currentCategory();
    }

    function visibleRecords() {
      const q = String(state.recordSearch || "").trim().toLowerCase();
      const paidTab = isPaidTab();
      return currentRecords()
        .filter((r) => r.type !== "Кредит")
        .filter((r) => paidTab ? isFullyPaid(r) : !isFullyPaid(r))
        .filter((r) => {
          if (!q && !paidTab && !matchesWorkCategory(r)) return false;
          if (state.paymentFilter !== "Все") {
            const methods = (r.payments || []).map((p) => p.paymentMethod || "");
            if (!methods.includes(state.paymentFilter)) return false;
          }
          if (!inSelectedPeriod(r)) return false;
          if (!recordMatchesSearch(r, q)) return false;
          return true;
        })
        .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.id || "").localeCompare(a.id || ""));
    }

    function hiddenPaidSearchHint() {
      if (isPaidTab()) return false;
      const q = String(state.recordSearch || "").trim().toLowerCase();
      if (!q) return false;
      return debtRecords(state.contractor).some((r) => isFullyPaid(r) && recordMatchesSearch(r, q) && inSelectedPeriod(r));
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function render() {
      const root = document.getElementById("app");
      if (state.view === "home") {
        root.innerHTML = renderHome();
      } else {
        root.innerHTML = renderProfile();
      }
      bindView();
    }

    function renderHome() {
      const totalsAll = globalDebtAndProfit();
      const cards = contractorNames().map((name) => {
        const cfg = contractorConfig(name);
        const t = totals(name);
        const profit = interestProfit(name);
        const loss = interestLoss(name);
        const ours = ourDebt(name);
        const overdue = hasOverdueDebt(name);
        const meta = cfg.hasRental ? "Аренда и займы" : "Только займы";
        const split = cfg.hasRental ? debitBreakdown(name) : null;
        const splitHtml = split ? `
            <div class="card-split">
              <div class="split-head"><span>Дебет</span><strong>${formatMoney(t.debit)}</strong></div>
              ${debitBreakdownRows(name, split).map(([label, amount]) => (
                `<div class="split-row"><span>${label}</span><b>${formatMoney(amount)}</b></div>`
              )).join("")}
            </div>
        ` : "";
        return `
          <div class="contractor-card-wrap">
          <button class="contractor-card ${overdue ? "overdue" : ""}" data-open="${escapeHtml(name)}">
            <div class="icon">👤</div>
            <div class="name">${escapeHtml(name)}</div>
            <div class="meta">${meta}</div>
            <div class="card-stats">
              <div class="stat">
                <div class="stat-label">Сальдо</div>
                <div class="stat-value saldo-${saldoTone(t.saldo)}">${formatMoney(t.saldo)}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Прибыль</div>
                <div class="stat-value profit">${formatMoney(profit)}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Наш долг</div>
                <div class="stat-value ${ours ? "loss" : ""}">${formatMoney(ours)}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Потери</div>
                <div class="stat-value ${loss ? "loss" : ""}">${formatMoney(loss)}</div>
              </div>
            </div>
            ${splitHtml}
            ${overdue ? `<div class="overdue-mark">Просрочен возврат долга</div>` : ""}
          </button>
          <button type="button" class="card-delete" data-delete-contractor="${escapeHtml(name)}" title="Удалить карточку" aria-label="Удалить карточку">✕</button>
          </div>
        `;
      }).join("");

      return `
        <div class="hero">
          <h1>Финансовый учёт</h1>
          <p>Контрагенты и дебиторская задолженность</p>
          <div class="sync-bar">
            <span class="sync-status ${syncState.status}" id="sync-status">${escapeHtml(syncState.message)}</span>
            <button type="button" class="sync-btn" id="sync-now">↻ Синхронизировать</button>
            <button type="button" class="sync-btn" id="sync-settings">Настройки синхронизации</button>
          </div>
        </div>
        <div class="home-totals">
          <div class="summary-card saldo">
            <div class="label">Сумма долгов</div>
            <div class="value ${saldoTone(totalsAll.debt)}">${formatMoney(totalsAll.debt)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Прибыль по процентам</div>
            <div class="value profit">${formatMoney(totalsAll.profit)}</div>
          </div>
          <div class="summary-card saldo">
            <div class="label">Сумма наших долгов</div>
            <div class="value ${totalsAll.ours ? "negative" : "zero"}">${formatMoney(totalsAll.ours)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Потери на процентах</div>
            <div class="value loss">${formatMoney(totalsAll.loss)}</div>
          </div>
        </div>
        <div class="contractors">
          ${cards}
          <button class="add-contractor" id="add-contractor">
            <div class="icon">➕</div>
            <div class="name">Добавить контрагента</div>
          </button>
        </div>
      `;
    }

    function renderProfile() {
      const name = state.contractor;
      const cfg = contractorConfig(name);
      const t = totals(name, true);
      const allTimeProfit = interestProfit(name);
      const allTimeLoss = interestLoss(name);
      const ours = ourDebt(name);
      const split = cfg.hasRental ? debitBreakdown(name, true) : null;
      const rows = visibleRecords();

      const closedCount = paidCount(name);
      const tabItems = [];
      if (cfg.hasRental) tabItems.push(["rental", "Аренда помещения"]);
      if (cfg.hasDtf) tabItems.push(["dtf", "Аренда ДТФ"]);
      if (cfg.hasInvoices) tabItems.push(["invoices", "Счета"]);
      tabItems.push(["debt", "Деньги в долг"]);
      const tabs = `
        <div class="tabs">
          ${tabItems.map(([id, label]) => (
            `<button class="tab ${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`
          )).join("")}
          <button class="tab paid-tab ${isPaidTab() ? "active" : ""}" data-tab="paid">Выплачено <span class="tab-count">${closedCount}</span></button>
        </div>
      `;

      const subtabs = (cfg.hasRental && state.tab === "rental") ? `
        <div class="subtabs">
          <button class="subtab ${state.subTab === "Коммуналка" ? "active" : ""}" data-sub="Коммуналка">Коммуналка</button>
          <button class="subtab ${state.subTab === "Аренда" ? "active" : ""}" data-sub="Аренда">Аренда</button>
        </div>
      ` : "";

      const overdueIds = overdueLoanIds(name);
      const rowClass = (r) => {
        if (isFullyPaid(r)) return "paid-row";
        if (overdueIds.has(r.id)) return "overdue-row";
        return "";
      };
      const remainClass = (r) => {
        if (isFullyPaid(r)) return "remain-paid";
        if (overdueIds.has(r.id)) return "remain-overdue";
        return "remain-open";
      };
      const payCount = (r) => (r.payments || []).length;
      const tableRows = rows.map((r) => `
        <tr class="${rowClass(r)}">
          <td>${formatDate(r.date)}</td>
          <td>${escapeHtml(r.category)}</td>
          <td>
            ${escapeHtml(r.subCategory || "—")}
            ${r.month ? `<span class="cell-extra">${escapeHtml(r.month)}</span>` : ""}
            ${r.invoiceNumber ? `<span class="cell-extra">№ ${escapeHtml(r.invoiceNumber)}</span>` : ""}
            ${r.issueDate ? `<span class="cell-extra">${isBorrowed(r) ? "получили" : "выдача"} ${formatDate(r.issueDate)}</span>` : ""}
            ${r.returnDate ? `<span class="cell-extra ${overdueIds.has(r.id) ? "overdue-mark" : ""}">вернуть до ${formatDate(r.returnDate)}${overdueIds.has(r.id) ? " · просрочен" : ""}</span>` : (isBorrowed(r) ? `<span class="cell-extra">без срока</span>` : "")}
            ${payCount(r) ? `<span class="cell-extra">${payCount(r)} ${payCount(r) === 1 ? "выплата" : "выплаты"}</span>` : ""}
          </td>
          <td>${formatMoney(r.amount)}</td>
          <td>${formatMoney(paymentSum(r))}</td>
          <td class="${remainClass(r)}">${formatMoney(Math.max(0, remainingOf(r)))}</td>
          <td class="${isFullyPaid(r) ? "remain-paid" : "type-debit"}">${escapeHtml(recordTypeLabel(r))}</td>
          <td class="muted">${r.category === "Деньги в долг" ? (isBorrowed(r) ? "потери " : "") + formatMoney(r.profit) : "—"}</td>
          <td class="wrap muted">${escapeHtml(r.comment || "—")}</td>
          <td>
            <div class="actions">
              ${isPaidTab() ? "" : `<button class="text-btn" data-pay="${escapeHtml(r.id)}" title="Внести выплату">Оплата</button>`}
              <button class="icon-btn" data-edit="${escapeHtml(r.id)}" title="Открыть долг" aria-label="Открыть долг">✏️</button>
              <button class="icon-btn danger" data-delete="${escapeHtml(r.id)}" title="Удалить" aria-label="Удалить">🗑️</button>
            </div>
          </td>
        </tr>
      `).join("");

      const cards = rows.map((r) => `
        <div class="record-card ${rowClass(r)}">
          <div class="row"><strong>${formatDate(r.date)}</strong><span class="${isFullyPaid(r) ? "remain-paid" : "type-debit"}">${escapeHtml(recordTypeLabel(r))}</span></div>
          <div class="row"><span>${escapeHtml(r.category)}${r.subCategory ? " · " + escapeHtml(r.subCategory) : ""}</span><strong>${formatMoney(r.amount)}</strong></div>
          <div class="row"><span>Остаток</span><strong class="${remainClass(r)}">${formatMoney(Math.max(0, remainingOf(r)))}</strong></div>
          <div class="row muted"><span>Выплачено ${formatMoney(paymentSum(r))}</span><span>${r.category === "Деньги в долг" ? (isBorrowed(r) ? "Потери: " : "Прибыль: ") + formatMoney(r.profit) : (r.month || r.invoiceNumber || "—")}</span></div>
          ${r.returnDate ? `<div class="row ${overdueIds.has(r.id) ? "overdue-mark" : "muted"}"><span>вернуть до ${formatDate(r.returnDate)}${overdueIds.has(r.id) ? " · просрочен" : ""}</span></div>` : (isBorrowed(r) ? `<div class="row muted"><span>без срока возврата</span></div>` : "")}
          ${r.comment ? `<div class="row muted"><span>${escapeHtml(r.comment)}</span></div>` : ""}
          <div class="row muted">
            <span></span>
            <span class="actions">
              ${isPaidTab() ? "" : `<button class="text-btn" data-pay="${escapeHtml(r.id)}">Оплата</button>`}
              <button class="icon-btn" data-edit="${escapeHtml(r.id)}" aria-label="Открыть долг">✏️</button>
              <button class="icon-btn danger" data-delete="${escapeHtml(r.id)}" aria-label="Удалить">🗑️</button>
            </span>
          </div>
        </div>
      `).join("");

      const tabRecords = currentRecords().filter((r) => {
        if (r.type === "Кредит") return false;
        if (isPaidTab()) return isFullyPaid(r);
        if (isFullyPaid(r)) return false;
        return matchesWorkCategory(r);
      });
      let emptyText = isPaidTab() ? "Выплаченных долгов пока нет" : "Открытых долгов нет";
      if (!rows.length) {
        if (String(state.recordSearch || "").trim()) {
          emptyText = hiddenPaidSearchHint()
            ? "Этот долг уже выплачен — откройте вкладку «Выплачено»"
            : "Нет записей по запросу";
        } else if (tabRecords.length && state.paymentFilter !== "Все") emptyText = "Нет записей с таким способом оплаты";
        else if (tabRecords.length) emptyText = "Нет записей за выбранный период";
      }

      const body = rows.length ? `
        <div class="table-scroll desktop-table">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Категория</th>
                <th>Подкатегория</th>
                <th>Сумма</th>
                <th>Оплачено</th>
                <th>Остаток</th>
                <th>Статус</th>
                <th>Прибыль</th>
                <th>Комментарий</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
        <div class="mobile-list">${cards}</div>
      ` : `<div class="empty">${emptyText}</div>`;

      const paymentFilter = `
        <div class="table-toolbar">
          <div class="toolbar-left">
            <input type="search" id="filter-search" placeholder="${escapeHtml(isPaidTab() ? "Поиск по выплаченным" : (state.recordSearch.trim() ? "Поиск по открытым долгам" : "Поиск по записям"))}" value="${escapeHtml(state.recordSearch)}" />
            <button type="button" class="collapse-btn" id="toggle-records">${state.recordsCollapsed ? "Показать записи" : "Свернуть записи"}</button>
          </div>
          <div class="toolbar-right">
            <label for="filter-payment">Способ оплаты</label>
            <select id="filter-payment">
              <option value="Все" ${state.paymentFilter === "Все" ? "selected" : ""}>Все</option>
              ${PAYMENT_METHODS.map((m) => `<option value="${escapeHtml(m)}" ${state.paymentFilter === m ? "selected" : ""}>${escapeHtml(m)}</option>`).join("")}
            </select>
          </div>
        </div>
      `;

      return `
        <div class="topbar">
          <button class="back-btn" id="back-home">← Назад</button>
          <h1>Финансовый учёт</h1>
          <button type="button" class="back-btn" id="delete-contractor" data-delete-contractor="${escapeHtml(name)}">Удалить карточку</button>
        </div>
        <div class="profile-name ${hasOverdueDebt(name) ? "overdue" : ""}">${escapeHtml(name)}</div>
        ${hasOverdueDebt(name) ? `<p class="overdue-mark" style="text-align:center;margin:-12px 0 18px;">Просрочен возврат долга</p>` : ""}
        <div class="analytics">
          <div class="analytics-head">
            <span class="title">Период</span>
            <select id="filter-period-mode">
              <option value="all" ${state.periodMode === "all" ? "selected" : ""}>Весь период</option>
              <option value="year" ${state.periodMode === "year" ? "selected" : ""}>Год</option>
              <option value="month" ${state.periodMode === "month" ? "selected" : ""}>Месяц</option>
            </select>
            <select id="filter-period-year" class="${state.periodMode === "all" ? "hidden" : ""}">
              ${periodYears().map((y) => `<option value="${y}" ${String(y) === String(state.periodYear) ? "selected" : ""}>${y}</option>`).join("")}
            </select>
            <select id="filter-period-month" class="${state.periodMode === "month" ? "" : "hidden"}">
              ${MONTHS.map((label, i) => `<option value="${i + 1}" ${String(i + 1) === String(state.periodMonth) ? "selected" : ""}>${label}</option>`).join("")}
            </select>
          </div>
          <div class="analytics-caption">${escapeHtml(periodRangeLabel())}</div>
        </div>
        <div class="summary">
          <div class="summary-card">
            <div class="label">Дебет</div>
            <div class="value">${formatMoney(t.debit)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Кредит</div>
            <div class="value">${formatMoney(t.credit)}</div>
          </div>
          <div class="summary-card saldo">
            <div class="label">Сальдо</div>
            <div class="value ${saldoTone(t.saldo)}">${formatMoney(t.saldo)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Прибыль за всё время</div>
            <div class="value profit">${formatMoney(allTimeProfit)}</div>
          </div>
          <div class="summary-card saldo">
            <div class="label">Наш долг</div>
            <div class="value ${ours ? "negative" : "zero"}">${formatMoney(ours)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Потери на процентах</div>
            <div class="value loss">${formatMoney(allTimeLoss)}</div>
          </div>
        </div>
        ${split ? `
        <div class="debit-breakdown">
          ${debitBreakdownRows(name, split).map(([label, amount]) => `
            <div class="item">
              <div class="label">${label}</div>
              <div class="value">${formatMoney(amount)}</div>
            </div>
          `).join("")}
        </div>
        ` : ""}
        ${tabs}
        ${subtabs}
        <div class="records-head">
          <button class="add-record" id="add-record">${isPaidTab() ? "➕ Внести выплату" : "➕ Добавить запись"}</button>
          ${paymentFilter}
        </div>
        <div class="table-panel ${state.recordsCollapsed ? "hidden" : ""}">${body}</div>
        ${state.recordsCollapsed ? `<div class="empty">Записи свёрнуты</div>` : ""}
      `;
    }

    function bindView() {
      document.getElementById("add-contractor")?.addEventListener("click", openContractorModal);
      document.getElementById("sync-now")?.addEventListener("click", () => { syncNow(); });
      document.getElementById("sync-settings")?.addEventListener("click", openSyncModal);
      document.getElementById("back-home")?.addEventListener("click", () => {
        state.view = "home";
        state.contractor = null;
        render();
      });
      document.getElementById("add-record")?.addEventListener("click", () => {
        if (isPaidTab()) openRecordModal(null, { repay: true });
        else openRecordModal();
      });
      document.getElementById("toggle-records")?.addEventListener("click", () => {
        state.recordsCollapsed = !state.recordsCollapsed;
        render();
      });
      document.getElementById("filter-search")?.addEventListener("input", (e) => {
        const pos = e.target.selectionStart;
        state.recordSearch = e.target.value;
        if (String(state.recordSearch).trim()) state.recordsCollapsed = false;
        render();
        const input = document.getElementById("filter-search");
        if (input) {
          input.focus();
          const next = Math.min(pos ?? input.value.length, input.value.length);
          input.setSelectionRange(next, next);
        }
      });
      document.getElementById("filter-payment")?.addEventListener("change", (e) => {
        state.paymentFilter = e.target.value;
        render();
      });
      document.getElementById("filter-period-mode")?.addEventListener("change", (e) => {
        state.periodMode = e.target.value;
        render();
      });
      document.getElementById("filter-period-year")?.addEventListener("change", (e) => {
        state.periodYear = e.target.value;
        render();
      });
      document.getElementById("filter-period-month")?.addEventListener("change", (e) => {
        state.periodMonth = e.target.value;
        render();
      });

      document.querySelectorAll("[data-open]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const name = btn.getAttribute("data-open");
          openContractor(name);
        });
      });

      document.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("data-tab");
          if (next !== "paid") state.workTab = next;
          state.tab = next;
          if (state.tab === "rental" && !RENTAL_SUBS.includes(state.subTab)) {
            state.subTab = "Коммуналка";
          }
          render();
        });
      });

      document.querySelectorAll("[data-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.subTab = btn.getAttribute("data-sub");
          render();
        });
      });

      document.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => openRecordModal(btn.getAttribute("data-edit")));
      });

      document.querySelectorAll("[data-pay]").forEach((btn) => {
        btn.addEventListener("click", () => openRecordModal(null, { repay: true, debtId: btn.getAttribute("data-pay") }));
      });

      document.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", () => askDelete(btn.getAttribute("data-delete")));
      });
      document.querySelectorAll("[data-delete-contractor]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          askDeleteContractor(btn.getAttribute("data-delete-contractor"));
        });
      });
    }

    function openContractor(name) {
      const cfg = contractorConfig(name);
      state.view = "profile";
      state.contractor = name;
      state.tab = cfg.hasRental ? "rental" : "debt";
      state.workTab = state.tab;
      state.subTab = "Коммуналка";
      state.paymentFilter = "Все";
      state.recordSearch = "";
      state.recordsCollapsed = false;
      state.periodMode = "all";
      state.periodYear = String(new Date().getFullYear());
      state.periodMonth = String(new Date().getMonth() + 1);
      render();
    }

    function fillSelect(el, items, selected) {
      el.innerHTML = items.map((item) => {
        const value = typeof item === "string" ? item : item.value;
        const label = typeof item === "string" ? item : item.label;
        return `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    function debtLabel(r) {
      const parts = [];
      if (isBorrowed(r)) parts.push("Наш долг");
      else parts.push(r.category || "Долг");
      if (r.subCategory) parts.push(r.subCategory);
      if (r.invoiceNumber) parts.push("№ " + r.invoiceNumber);
      if (r.month) parts.push(r.month);
      parts.push(formatDate(r.date || r.issueDate));
      parts.push(formatMoney(r.amount));
      parts.push(isFullyPaid(r) ? "погашен" : "остаток " + formatMoney(Math.max(0, remainingOf(r))));
      return parts.join(" · ");
    }

    function fillDebtTarget(selectedId) {
      const el = document.getElementById("field-debt-target");
      const cat = currentCategory();
      const recs = debtRecords(state.contractor)
        .filter((r) => !isFullyPaid(r) || r.id === selectedId)
        .slice()
        .sort((a, b) => {
          const ac = a.category === cat ? 0 : 1;
          const bc = b.category === cat ? 0 : 1;
          if (ac !== bc) return ac - bc;
          return (b.date || b.issueDate || "").localeCompare(a.date || a.issueDate || "");
        });
      let html = `<option value="">Выберите долг</option>`;
      html += recs.map((r) => `<option value="${escapeHtml(r.id)}" ${r.id === selectedId ? "selected" : ""}>${escapeHtml(debtLabel(r))}</option>`).join("");
      el.innerHTML = html;
    }

    function renderPaymentsPanel() {
      const rec = currentRecords().find((r) => r.id === state.editingId);
      const list = document.getElementById("payments-list");
      const remainEl = document.getElementById("payments-remaining");
      if (!rec) {
        list.innerHTML = "";
        remainEl.textContent = "";
        return;
      }
      const paid = isFullyPaid(rec);
      remainEl.textContent = paid
        ? "Погашен · выплачено " + formatMoney(paymentSum(rec))
        : "Остаток " + formatMoney(Math.max(0, remainingOf(rec)));
      remainEl.className = paid ? "remain-paid" : "remain-open";
      const payments = (rec.payments || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      list.innerHTML = payments.length ? payments.map((p) => `
        <div class="payment-item">
          <div>
            <div>${formatDate(p.date)} · ${formatMoney(p.amount)}</div>
            <div class="meta">${escapeHtml(p.paymentMethod || "—")}${p.comment ? " · " + escapeHtml(p.comment) : ""}</div>
          </div>
          <span></span>
          <button type="button" class="icon-btn danger" data-delete-pay="${escapeHtml(p.id)}" title="Удалить выплату" aria-label="Удалить выплату">🗑️</button>
        </div>
      `).join("") : `<div class="empty" style="padding:10px 0;">Выплат пока нет</div>`;
      list.querySelectorAll("[data-delete-pay]").forEach((btn) => {
        btn.addEventListener("click", () => askDeletePayment(state.editingId, btn.getAttribute("data-delete-pay")));
      });
    }

    function addPaymentToDebt(debtId, payment) {
      const rec = currentRecords().find((r) => r.id === debtId);
      if (!rec) return null;
      if (!Array.isArray(rec.payments)) rec.payments = [];
      rec.payments.push(payment);
      saveData(db);
      return rec;
    }

    function syncRecordFields() {
      const category = document.getElementById("field-category").value;
      const isDebt = category === "Деньги в долг";
      const isInvoice = category === "Счета";
      const isPeriod = category === "Аренда помещения" || category === "Аренда ДТФ";
      const borrowed = isDebt && state.loanSide === "in";
      const isRepay = !state.editingId && state.recordType === "Кредит";
      const isEditing = Boolean(state.editingId);
      const isDebtIssue = !isRepay && isDebt;

      document.getElementById("type-field").classList.toggle("hidden", isEditing);
      document.getElementById("debt-target-field").classList.toggle("hidden", !isRepay);
      document.getElementById("category-field").classList.add("hidden");
      document.getElementById("subcategory-field").classList.add("hidden");
      document.getElementById("amount-label").textContent = isRepay ? "Сумма выплаты" : "Сумма";
      document.getElementById("loanside-field").classList.toggle("hidden", isRepay || !isDebt);
      document.getElementById("date-field").classList.toggle("hidden", isDebtIssue);
      document.getElementById("date-label").textContent = isRepay
        ? "Дата выплаты"
        : (isInvoice ? "Дата счета" : "Дата");
      document.getElementById("month-field").classList.toggle("hidden", isRepay || !isPeriod);
      document.getElementById("year-field").classList.toggle("hidden", isRepay || !isPeriod);
      document.getElementById("invoice-field").classList.toggle("hidden", isRepay || !isInvoice);
      document.getElementById("comment-field").classList.remove("hidden");
      document.getElementById("payment-field").classList.toggle("hidden", !isRepay);
      document.getElementById("issue-field").classList.toggle("hidden", isRepay || !isDebtIssue);
      document.getElementById("issue-label").textContent = borrowed ? "Дата получения" : "Дата выдачи";
      document.getElementById("return-field").classList.toggle("hidden", isRepay || !isDebtIssue);
      document.getElementById("return-label").textContent = borrowed ? "Срок возврата (необязательно)" : "Срок возврата";
      document.getElementById("rate-field").classList.toggle("hidden", isRepay || !isDebtIssue);
      document.getElementById("profit-preview").classList.toggle("hidden", isRepay || !isDebtIssue);
      document.getElementById("payments-panel").classList.toggle("hidden", !isEditing);
      document.getElementById("side-out").classList.toggle("active", state.loanSide !== "in");
      document.getElementById("side-in").classList.toggle("active", state.loanSide === "in");
      document.getElementById("type-debit").textContent = "Долг";
      document.getElementById("type-credit").textContent = "Возврат";
      const saveBtn = document.querySelector("#record-form button[type='submit']");
      if (saveBtn) saveBtn.textContent = isRepay ? "Внести выплату" : "Сохранить";
      if (isEditing) renderPaymentsPanel();
      updateProfitPreview();
    }

    function updateProfitPreview() {
      const amount = document.getElementById("field-amount").value;
      const rate = document.getElementById("field-rate").value;
      const issue = document.getElementById("field-issue").value;
      const ret = document.getElementById("field-return").value;
      const profit = calcProfit(amount, rate, issue, ret);
      const preview = document.getElementById("profit-preview");
      const borrowed = state.loanSide === "in";
      preview.classList.toggle("loss", borrowed);
      preview.textContent = (borrowed ? "Потери: " : "Прибыль: ") + formatMoney(profit);
    }

    function setRecordType(type) {
      state.recordType = type;
      document.getElementById("type-debit").classList.toggle("active", type === "Дебет");
      document.getElementById("type-credit").classList.toggle("active", type === "Кредит");
      if (type === "Кредит") {
        if (!state.repayTargetId) {
          const first = debtRecords(state.contractor).find((r) => {
            if (isFullyPaid(r)) return false;
            const tab = workTabId();
            if (tab === "rental") return r.category === "Аренда помещения" && r.subCategory === state.subTab;
            return r.category === currentCategory();
          }) || debtRecords(state.contractor).find((r) => !isFullyPaid(r));
          state.repayTargetId = first ? first.id : null;
        }
        fillDebtTarget(state.repayTargetId);
        const rec = currentRecords().find((r) => r.id === state.repayTargetId);
        if (rec) {
          const left = remainingOf(rec);
          if (left > 0.009) document.getElementById("field-amount").value = String(left);
        }
      }
      syncRecordFields();
    }

    function setLoanSide(side) {
      state.loanSide = side === "in" ? "in" : "out";
      syncRecordFields();
    }

    function paymentMethodOptions(selected) {
      fillSelect(document.getElementById("field-payment"), [
        { value: "", label: "Выберите способ оплаты" },
        ...PAYMENT_METHODS
      ], selected || "");
      fillSelect(document.getElementById("pay-method"), [
        { value: "", label: "Выберите способ оплаты" },
        ...PAYMENT_METHODS
      ], "");
    }

    function openRecordModal(id, opts) {
      const options = opts || {};
      const form = document.getElementById("record-form");
      form.reset();
      document.getElementById("record-error").classList.remove("show");
      document.getElementById("pay-error").classList.remove("show");
      state.editingId = options.repay ? null : (id || null);
      state.repayTargetId = options.repay ? (options.debtId || id || null) : null;

      fillSelect(document.getElementById("field-category"), availableCategories(state.contractor), currentCategory());
      fillSelect(document.getElementById("field-subcategory"), RENTAL_SUBS, state.subTab || "Коммуналка");
      fillSelect(document.getElementById("field-month"), MONTHS, MONTHS[new Date().getMonth()]);
      const years = [];
      for (let y = 2020; y <= 2030; y++) years.push(String(y));
      fillSelect(document.getElementById("field-year"), years, String(new Date().getFullYear()));
      paymentMethodOptions("");

      document.getElementById("field-date").value = todayIso();
      document.getElementById("field-issue").value = todayIso();
      document.getElementById("field-rate").value = "0";
      document.getElementById("pay-date").value = todayIso();
      document.getElementById("pay-amount").value = "";
      document.getElementById("pay-comment").value = "";
      state.loanSide = "out";

      if (options.repay) {
        document.getElementById("record-title").textContent = "Внести выплату";
        fillDebtTarget(state.repayTargetId);
        setRecordType("Кредит");
        const rec = currentRecords().find((r) => r.id === state.repayTargetId);
        if (rec) {
          const left = remainingOf(rec);
          if (left > 0.009) document.getElementById("field-amount").value = String(left);
        }
        document.getElementById("record-overlay").classList.add("open");
        document.getElementById("field-amount").focus();
        return;
      }

      document.getElementById("record-title").textContent = id ? "Долг" : "Добавить запись";
      setRecordType("Дебет");

      if (id) {
        const rec = currentRecords().find((r) => r.id === id);
        if (rec) {
          document.getElementById("field-category").value = rec.category;
          if (rec.subCategory && RENTAL_SUBS.includes(rec.subCategory)) {
            document.getElementById("field-subcategory").value = rec.subCategory;
          }
          document.getElementById("field-amount").value = rec.amount;
          document.getElementById("field-date").value = rec.date || "";
          state.loanSide = rec.loanSide === "in" ? "in" : "out";
          if (rec.month) {
            const [monthName, year] = rec.month.split(" ");
            if (MONTHS.includes(monthName)) document.getElementById("field-month").value = monthName;
            if (year) document.getElementById("field-year").value = String(rec.year || year);
          } else if (rec.year) {
            document.getElementById("field-year").value = String(rec.year);
          }
          document.getElementById("field-invoice").value = rec.invoiceNumber || "";
          document.getElementById("field-comment").value = rec.comment || "";
          document.getElementById("field-issue").value = rec.issueDate || rec.date || "";
          document.getElementById("field-return").value = rec.returnDate || "";
          document.getElementById("field-rate").value = rec.interestRate ?? 0;
          const left = remainingOf(rec);
          document.getElementById("pay-amount").value = left > 0.009 ? String(left) : "";
        }
      }

      syncRecordFields();
      document.getElementById("record-overlay").classList.add("open");
      document.getElementById("field-amount").focus();
    }

    function closeRecordModal() {
      document.getElementById("record-overlay").classList.remove("open");
      state.editingId = null;
      state.repayTargetId = null;
    }

    function submitRepayment() {
      const error = document.getElementById("record-error");
      const amount = Number(document.getElementById("field-amount").value);
      const debtId = document.getElementById("field-debt-target").value;
      const date = document.getElementById("field-date").value;
      const paymentMethod = document.getElementById("field-payment").value;
      if (!debtId) {
        error.textContent = "Выберите долг";
        error.classList.add("show");
        return;
      }
      if (!document.getElementById("field-amount").value || Number.isNaN(amount) || amount <= 0) {
        error.textContent = "Укажите сумму выплаты";
        error.classList.add("show");
        return;
      }
      if (!date) {
        error.textContent = "Укажите дату выплаты";
        error.classList.add("show");
        return;
      }
      if (!paymentMethod) {
        error.textContent = "Укажите способ оплаты";
        error.classList.add("show");
        return;
      }
      const rec = addPaymentToDebt(debtId, {
        id: uid(),
        date,
        amount,
        paymentMethod,
        comment: document.getElementById("field-comment").value.trim()
      });
      if (!rec) {
        error.textContent = "Не удалось найти выбранный долг";
        error.classList.add("show");
        return;
      }
      closeRecordModal();
      render();
      showToast(isFullyPaid(rec) ? "Долг погашен — смотрите во вкладке «Выплачено»" : "Выплата внесена");
    }

    function submitRecord(event) {
      event.preventDefault();
      const error = document.getElementById("record-error");
      error.classList.remove("show");
      if (!state.editingId && state.recordType === "Кредит") {
        submitRepayment();
        return;
      }
      const amount = Number(document.getElementById("field-amount").value);
      const category = document.getElementById("field-category").value;
      const isDebt = category === "Деньги в долг";
      const isInvoice = category === "Счета";
      const isPeriod = category === "Аренда помещения" || category === "Аренда ДТФ";
      const borrowed = isDebt && state.loanSide === "in";
      const issueDate = document.getElementById("field-issue").value || null;
      const returnDate = document.getElementById("field-return").value || null;
      const date = isDebt ? issueDate : document.getElementById("field-date").value;
      if (!document.getElementById("field-amount").value || Number.isNaN(amount) || amount <= 0) {
        error.textContent = "Укажите сумму";
        error.classList.add("show");
        return;
      }
      if (!date) {
        error.textContent = isDebt
          ? (borrowed ? "Укажите дату получения" : "Укажите дату выдачи")
          : "Укажите дату";
        error.classList.add("show");
        return;
      }
      if (isDebt && !borrowed && !returnDate) {
        error.textContent = "Укажите срок возврата";
        error.classList.add("show");
        return;
      }
      if (isDebt && returnDate && returnDate < date) {
        error.textContent = "Срок возврата не может быть раньше даты выдачи";
        error.classList.add("show");
        return;
      }

      const subCategory = category === "Аренда помещения" ? document.getElementById("field-subcategory").value : null;
      const monthName = document.getElementById("field-month").value;
      const year = Number(document.getElementById("field-year").value);
      const interestRate = Number(document.getElementById("field-rate").value) || 0;
      const existing = state.editingId ? currentRecords().find((r) => r.id === state.editingId) : null;

      const record = {
        id: state.editingId || uid(),
        category,
        subCategory,
        type: "Дебет",
        amount,
        date,
        month: isPeriod ? `${monthName} ${year}` : null,
        year: isPeriod ? year : null,
        invoiceNumber: isInvoice ? document.getElementById("field-invoice").value.trim() : null,
        paymentMethod: null,
        comment: document.getElementById("field-comment").value.trim(),
        issueDate: isDebt ? issueDate : null,
        returnDate: isDebt ? returnDate : null,
        interestRate: isDebt ? interestRate : null,
        loanSide: isDebt ? (borrowed ? "in" : "out") : null,
        profit: isDebt ? calcProfit(amount, interestRate, issueDate, returnDate) : 0,
        payments: existing && Array.isArray(existing.payments) ? existing.payments : []
      };

      const list = db.contractors[state.contractor].records;
      const idx = list.findIndex((r) => r.id === record.id);
      if (idx >= 0) list[idx] = record;
      else list.push(record);
      saveData(db);
      closeRecordModal();
      render();
      showToast(idx >= 0 ? "Долг обновлён" : "Долг сохранён");
    }

    function submitInlinePayment() {
      const error = document.getElementById("pay-error");
      error.classList.remove("show");
      if (!state.editingId) return;
      const amount = Number(document.getElementById("pay-amount").value);
      const date = document.getElementById("pay-date").value;
      const paymentMethod = document.getElementById("pay-method").value;
      if (!document.getElementById("pay-amount").value || Number.isNaN(amount) || amount <= 0) {
        error.textContent = "Укажите сумму выплаты";
        error.classList.add("show");
        return;
      }
      if (!date) {
        error.textContent = "Укажите дату выплаты";
        error.classList.add("show");
        return;
      }
      if (!paymentMethod) {
        error.textContent = "Укажите способ оплаты";
        error.classList.add("show");
        return;
      }
      const rec = addPaymentToDebt(state.editingId, {
        id: uid(),
        date,
        amount,
        paymentMethod,
        comment: document.getElementById("pay-comment").value.trim()
      });
      if (!rec) {
        error.textContent = "Не удалось добавить выплату";
        error.classList.add("show");
        return;
      }
      const closed = isFullyPaid(rec);
      document.getElementById("pay-amount").value = "";
      document.getElementById("pay-comment").value = "";
      document.getElementById("pay-date").value = todayIso();
      document.getElementById("pay-method").value = "";
      if (closed) closeRecordModal();
      render();
      if (!closed && state.editingId) renderPaymentsPanel();
      showToast(closed ? "Долг погашен — смотрите во вкладке «Выплачено»" : "Выплата внесена");
    }

    function askDelete(id) {
      state.pendingDelete = { kind: "record", id };
      document.getElementById("confirm-title").textContent = "Удалить долг?";
      document.getElementById("confirm-text").textContent = "Будут удалены долг и все выплаты по нему.";
      document.getElementById("confirm-overlay").classList.add("open");
    }

    function askDeletePayment(debtId, paymentId) {
      state.pendingDelete = { kind: "payment", debtId, id: paymentId };
      document.getElementById("confirm-title").textContent = "Удалить выплату?";
      document.getElementById("confirm-text").textContent = "Выплата будет снята с этого долга.";
      document.getElementById("confirm-overlay").classList.add("open");
    }

    function askDeleteContractor(name) {
      state.pendingDelete = { kind: "contractor", name };
      document.getElementById("confirm-title").textContent = "Удалить карточку?";
      document.getElementById("confirm-text").textContent = "Будут удалены контрагент «" + name + "» и все его записи.";
      document.getElementById("confirm-overlay").classList.add("open");
    }

    function confirmDelete() {
      const pending = state.pendingDelete;
      if (!pending) return;
      if (pending.kind === "contractor") {
        const name = pending.name;
        const records = db.contractors[name]?.records || [];
        db.deletedRecordIds = db.deletedRecordIds || [];
        records.forEach((r) => {
          if (r.id && !db.deletedRecordIds.includes(r.id)) db.deletedRecordIds.push(r.id);
        });
        db.deletedContractorNames = db.deletedContractorNames || [];
        if (!db.deletedContractorNames.includes(name)) db.deletedContractorNames.push(name);
        delete db.contractors[name];
        saveData(db);
        state.pendingDelete = null;
        document.getElementById("confirm-overlay").classList.remove("open");
        if (state.contractor === name) {
          state.view = "home";
          state.contractor = null;
        }
        render();
        showToast("Карточка удалена");
        return;
      }
      if (pending.kind === "payment") {
        const rec = currentRecords().find((r) => r.id === pending.debtId);
        if (rec) {
          rec.payments = (rec.payments || []).filter((p) => p.id !== pending.id);
        }
        db.deletedPaymentIds = db.deletedPaymentIds || [];
        if (pending.id && !db.deletedPaymentIds.includes(pending.id)) db.deletedPaymentIds.push(pending.id);
        saveData(db);
        state.pendingDelete = null;
        document.getElementById("confirm-overlay").classList.remove("open");
        render();
        if (state.editingId) renderPaymentsPanel();
        showToast("Выплата удалена");
        return;
      }
      const id = pending.id;
      if (!id) return;
      db.deletedRecordIds = db.deletedRecordIds || [];
      if (!db.deletedRecordIds.includes(id)) db.deletedRecordIds.push(id);
      db.contractors[state.contractor].records = currentRecords().filter((r) => r.id !== id);
      saveData(db);
      state.pendingDelete = null;
      document.getElementById("confirm-overlay").classList.remove("open");
      render();
      showToast("Долг удалён");
    }

    function openContractorModal() {
      document.getElementById("contractor-form").reset();
      document.getElementById("contractor-error").classList.remove("show");
      document.getElementById("contractor-overlay").classList.add("open");
      document.getElementById("field-contractor-name").focus();
    }

    function closeContractorModal() {
      document.getElementById("contractor-overlay").classList.remove("open");
    }

    function openSyncModal() {
      const cfg = getSyncConfig();
      document.getElementById("field-sync-url").value = cfg.url || DEFAULT_SYNC_URL;
      document.getElementById("field-sync-key").value = cfg.key || "";
      document.getElementById("field-sync-sql").value = SYNC_SQL;
      document.getElementById("sync-error").classList.remove("show");
      document.getElementById("sync-overlay").classList.add("open");
      document.getElementById("field-sync-key").focus();
    }

    function closeSyncModal() {
      document.getElementById("sync-overlay").classList.remove("open");
    }

    async function submitSync(event) {
      event.preventDefault();
      const error = document.getElementById("sync-error");
      const url = document.getElementById("field-sync-url").value.trim().replace(/\/$/, "");
      const key = document.getElementById("field-sync-key").value.trim();
      if (!url || !key) {
        error.textContent = "Укажите адрес проекта и ключ anon";
        error.classList.add("show");
        return;
      }
      setSyncConfig({ url, key });
      closeSyncModal();
      await syncNow();
    }

    function submitContractor(event) {
      event.preventDefault();
      const error = document.getElementById("contractor-error");
      const name = document.getElementById("field-contractor-name").value.trim();
      if (!name) {
        error.textContent = "Введите имя контрагента";
        error.classList.add("show");
        return;
      }
      if (db.contractors[name]) {
        error.textContent = "Контрагент с таким именем уже существует";
        error.classList.add("show");
        return;
      }
      db.deletedContractorNames = (db.deletedContractorNames || []).filter((n) => n !== name);
      db.contractors[name] = { records: [] };
      saveData(db);
      closeContractorModal();
      render();
      showToast("Контрагент добавлен");
    }

    function closeOverlays() {
      closeRecordModal();
      closeContractorModal();
      closeSyncModal();
      document.getElementById("confirm-overlay").classList.remove("open");
      state.pendingDelete = null;
    }

    document.getElementById("record-form").addEventListener("submit", submitRecord);
    document.getElementById("record-cancel").addEventListener("click", closeRecordModal);
    document.getElementById("field-category").addEventListener("change", () => {
      if (document.getElementById("field-category").value === "Аренда помещения") {
        fillSelect(document.getElementById("field-subcategory"), RENTAL_SUBS, state.subTab || "Коммуналка");
      }
      syncRecordFields();
    });
    document.getElementById("field-subcategory").addEventListener("change", syncRecordFields);
    ["field-amount", "field-rate", "field-issue", "field-return"].forEach((id) => {
      document.getElementById(id).addEventListener("input", updateProfitPreview);
    });
    document.getElementById("type-debit").addEventListener("click", () => setRecordType("Дебет"));
    document.getElementById("type-credit").addEventListener("click", () => setRecordType("Кредит"));
    document.getElementById("field-debt-target").addEventListener("change", () => {
      state.repayTargetId = document.getElementById("field-debt-target").value || null;
      const rec = currentRecords().find((r) => r.id === state.repayTargetId);
      if (rec) {
        const left = remainingOf(rec);
        if (left > 0.009) document.getElementById("field-amount").value = String(left);
      }
    });
    document.getElementById("pay-add").addEventListener("click", submitInlinePayment);
    document.getElementById("side-out").addEventListener("click", () => setLoanSide("out"));
    document.getElementById("side-in").addEventListener("click", () => setLoanSide("in"));
    document.getElementById("contractor-form").addEventListener("submit", submitContractor);
    document.getElementById("contractor-cancel").addEventListener("click", closeContractorModal);
    document.getElementById("sync-form").addEventListener("submit", submitSync);
    document.getElementById("sync-cancel").addEventListener("click", closeSyncModal);
    document.getElementById("sync-overlay").addEventListener("click", (e) => {
      if (e.target.id === "sync-overlay") closeSyncModal();
    });
    document.getElementById("confirm-cancel").addEventListener("click", () => {
      document.getElementById("confirm-overlay").classList.remove("open");
      state.pendingDelete = null;
    });
    document.getElementById("confirm-ok").addEventListener("click", confirmDelete);
    document.getElementById("record-overlay").addEventListener("click", (e) => {
      if (e.target.id === "record-overlay") closeRecordModal();
    });
    document.getElementById("contractor-overlay").addEventListener("click", (e) => {
      if (e.target.id === "contractor-overlay") closeContractorModal();
    });
    document.getElementById("confirm-overlay").addEventListener("click", (e) => {
      if (e.target.id === "confirm-overlay") {
        document.getElementById("confirm-overlay").classList.remove("open");
        state.pendingDelete = null;
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeOverlays();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && getSyncConfig().key) syncNow();
    });

    render();
    if (getSyncConfig().key) {
      setSyncStatus("busy", "Синхронизация…");
      syncNow();
    }
  </script>
</body>
</html>
