<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Финансовый учёт</title>
  <style>
    :root {
      --bg-start: #0a1628;
      --bg-end: #121f3a;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --text-secondary: #b0c4de;
      --accent: #4a9eff;
      --accent-soft: rgba(74, 158, 255, 0.18);
      --debit: #6ec8ff;
      --credit: #f0a070;
      --danger: #ff7b7b;
      --saldo-plus: #5ee9a3;
      --saldo-minus: #ff6b6b;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      line-height: 1.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(900px 500px at 12% -10%, rgba(74, 158, 255, 0.16), transparent 55%),
        radial-gradient(700px 420px at 100% 0%, rgba(110, 200, 255, 0.08), transparent 50%);
      z-index: 0;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 48px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .topbar h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      flex: 1;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      color: var(--text-secondary);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: background 0.3s, color 0.3s, transform 0.3s;
    }

    .back-btn:hover {
      background: var(--card-hover);
      color: var(--text);
      transform: translateX(-2px);
    }

    .hero {
      text-align: center;
      margin: 24px 0 32px;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin-top: 8px;
      color: var(--text-secondary);
    }

    .sync-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 8px;
    }

    .sync-status {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .sync-status.ok { color: var(--saldo-plus); }
    .sync-status.error { color: var(--saldo-minus); }
    .sync-status.busy { color: var(--debit); }

    .sync-btn {
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text-secondary);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: background 0.3s, color 0.3s;
    }

    .sync-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .sql-box {
      width: 100%;
      min-height: 140px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .home-totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 0 0 24px;
    }

    .home-totals .summary-card .value.profit {
      color: var(--saldo-plus);
    }

    .home-totals .summary-card .value.loss,
    .summary-card .value.loss,
    .card-stats .stat-value.loss {
      color: var(--saldo-minus);
    }

    .contractor-card-wrap {
      position: relative;
      min-width: 0;
    }

    .contractor-card-wrap .contractor-card {
      width: 100%;
      height: 100%;
    }

    .card-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1;
    }

    .card-delete:hover {
      background: rgba(255, 107, 107, 0.25);
      color: var(--danger);
    }

    .contractors {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .contractor-card,
    .add-contractor {
      min-height: 180px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 22px 16px 18px;
      transition: transform 0.3s, background 0.3s, border-color 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .contractor-card:hover,
    .add-contractor:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    .contractor-card .icon,
    .add-contractor .icon {
      font-size: 2.2rem;
    }

    .contractor-card .name {
      font-size: 1.25rem;
      font-weight: 650;
    }

    .contractor-card .meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .card-stats .stat {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }

    .card-stats .stat-label {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .card-stats .stat-value {
      font-size: 0.92rem;
      font-weight: 700;
      margin-top: 3px;
    }

    .card-split {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .card-split .split-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .card-split .split-head strong {
      color: var(--debit);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .card-split .split-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .card-split .split-row b {
      color: var(--text);
      font-weight: 600;
    }

    .debit-breakdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: -10px 0 24px;
    }

    .debit-breakdown .item {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .debit-breakdown .item .label {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .debit-breakdown .item .value {
      font-size: 1rem;
      font-weight: 650;
      color: var(--debit);
    }

    .contractor-card.overdue {
      border-color: rgba(255, 107, 107, 0.55);
      box-shadow: 0 8px 32px rgba(255, 80, 80, 0.2);
      background: rgba(255, 107, 107, 0.08);
    }

    .contractor-card.overdue .name,
    .profile-name.overdue,
    .overdue-mark,
    .cell-extra.overdue-mark {
      color: var(--saldo-minus);
    }

    .contractor-card .overdue-mark {
      font-size: 0.82rem;
      font-weight: 650;
    }

    tr.overdue-row td {
      background: rgba(255, 107, 107, 0.08);
    }

    .record-card.overdue-row {
      border: 1px solid rgba(255, 107, 107, 0.35);
    }

    .saldo-positive { color: var(--saldo-plus); }
    .saldo-negative { color: var(--saldo-minus); }

    .add-contractor {
      border: 1px dashed rgba(74, 158, 255, 0.45);
      color: var(--debit);
      justify-content: center;
    }

    .profile-name {
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      font-weight: 750;
      margin: 8px 0 24px;
      letter-spacing: -0.03em;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .summary-card .label {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: clamp(1.05rem, 2.4vw, 1.65rem);
      font-weight: 700;
      color: var(--debit);
    }

    .summary-card .value.profit {
      color: var(--saldo-plus);
    }

    .summary-card.saldo .value.positive {
      color: var(--saldo-plus);
    }

    .summary-card.saldo .value.negative {
      color: var(--saldo-minus);
    }

    .summary-card.saldo .value.zero {
      color: var(--text);
    }

    .tabs, .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab, .subtab {
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.3s, color 0.3s, border-color 0.3s, transform 0.3s;
    }

    .tab.active, .subtab.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: rgba(74, 158, 255, 0.45);
    }

    .tab:hover, .subtab:hover {
      transform: translateY(-1px);
      color: var(--text);
    }

    .table-panel {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    td.wrap {
      white-space: normal;
      max-width: 200px;
    }

    .analytics {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .analytics-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
    }

    .analytics-head .title {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .analytics-head select {
      min-width: 160px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      outline: none;
    }

    .analytics-head select option {
      background: #121f3a;
      color: #fff;
    }

    .analytics-caption {
      margin-top: 10px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .table-toolbar label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .table-toolbar select {
      min-width: 220px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      outline: none;
    }

    .table-toolbar select option {
      background: #121f3a;
      color: #fff;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      white-space: nowrap;
    }

    th {
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 600;
    }

    td.muted {
      color: var(--text-secondary);
    }

    .type-debit { color: var(--debit); font-weight: 600; }
    .type-credit { color: var(--credit); font-weight: 600; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      transition: background 0.3s, transform 0.3s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .icon-btn.danger:hover {
      background: rgba(255, 123, 123, 0.18);
    }

    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .add-record {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      box-shadow: var(--shadow);
      transition: transform 0.3s, filter 0.3s;
    }

    .add-record:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .mobile-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .record-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 14px;
    }

    .record-card .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .record-card .row:last-child {
      margin-bottom: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 22, 0.72);
      backdrop-filter: blur(6px);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(18, 31, 58, 0.96), rgba(10, 22, 40, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .modal h2 {
      font-size: 1.25rem;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      background: rgba(74, 158, 255, 0.08);
    }

    .field select option {
      background: #121f3a;
      color: #fff;
    }

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .type-toggle button {
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .type-toggle button.active.debit {
      background: rgba(110, 200, 255, 0.16);
      color: var(--debit);
      border-color: rgba(110, 200, 255, 0.4);
    }

    .type-toggle button.active.credit {
      background: rgba(240, 160, 112, 0.16);
      color: var(--credit);
      border-color: rgba(240, 160, 112, 0.4);
    }

    .profit-preview {
      margin: 4px 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--debit);
      font-weight: 650;
    }

    .profit-preview.loss {
      background: rgba(255, 107, 107, 0.12);
      color: var(--saldo-minus);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 650;
      transition: transform 0.3s, filter 0.3s, background 0.3s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
    }

    .btn-primary:hover, .btn-secondary:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: -6px 0 12px;
      display: none;
    }

    .error.show { display: block; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(18, 31, 58, 0.95);
      border: 1px solid rgba(74, 158, 255, 0.35);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 40;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .confirm-text {
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    .hidden { display: none !important; }

    .cell-extra {
      display: block;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 3px;
      white-space: normal;
    }

    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .debit-breakdown { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 760px) {
      .app { padding: 18px 14px 36px; }
      .desktop-table { display: none; }
      .mobile-list { display: flex; }
      .table-panel { overflow: visible; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <div class="overlay" id="record-overlay" role="dialog" aria-modal="true">
    <form class="modal" id="record-form" novalidate>
      <h2 id="record-title">Добавить запись</h2>
      <div class="field hidden" id="category-field">
        <label for="field-category">Категория</label>
        <select id="field-category"></select>
      </div>
      <div class="field hidden" id="subcategory-field">
        <label for="field-subcategory">Подкатегория</label>
        <select id="field-subcategory"></select>
      </div>
      <div class="field">
        <label for="field-amount">Сумма</label>
        <input id="field-amount" type="number" min="0.01" step="0.01" placeholder="0" required />
      </div>
      <div class="field" id="date-field">
        <label for="field-date" id="date-label">Дата</label>
        <input id="field-date" type="date" />
      </div>
      <div class="field">
        <label>Тип</label>
        <div class="type-toggle">
          <button type="button" class="active debit" data-type="Дебет" id="type-debit">Дебет</button>
          <button type="button" class="credit" data-type="Кредит" id="type-credit">Кредит</button>
        </div>
      </div>
      <div class="field hidden" id="loanside-field">
        <label>Займ</label>
        <div class="type-toggle">
          <button type="button" class="active debit" id="side-out">Выдали</button>
          <button type="button" class="credit" id="side-in">Взяли</button>
        </div>
      </div>
      <div class="field hidden" id="month-field">
        <label for="field-month">Месяц</label>
        <select id="field-month"></select>
      </div>
      <div class="field hidden" id="year-field">
        <label for="field-year">Год</label>
        <select id="field-year"></select>
      </div>
      <div class="field hidden" id="invoice-field">
        <label for="field-invoice">Номер счета</label>
        <input id="field-invoice" type="text" placeholder="Например, СЧ-104" />
      </div>
      <div class="field hidden" id="issue-field">
        <label for="field-issue" id="issue-label">Дата выдачи</label>
        <input id="field-issue" type="date" />
      </div>
      <div class="field hidden" id="return-field">

      <div class="error" id="contractor-error"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="contractor-cancel">Отмена</button>
        <button type="submit" class="btn-primary">Сохранить</button>

  <div class="overlay" id="confirm-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="confirm-title">Удалить запись?</h2>
      <p class="confirm-text" id="confirm-text">Это действие нельзя отменить.</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="confirm-cancel">Отмена</button>
        <button type="button" class="btn-primary" id="confirm-ok">Удалить</button>

  <div class="overlay" id="sync-overlay" role="dialog" aria-modal="true">
    <form class="modal" id="sync-form">
      <h2>Синхронизация</h2>
      <p class="confirm-text">Ключ проекта уже задан. Осталось один раз создать таблицу: выполните SQL ниже в SQL Editor или сделайте supabase db push.</p>
      <div class="field">
        <label for="field-sync-url">Адрес проекта</label>
        <input id="field-sync-url" type="url" />
      </div>
      <div class="field">
        <label for="field-sync-key">Ключ anon (public)</label>
        <input id="field-sync-key" type="text" placeholder="Project Settings → API → anon public" autocomplete="off" />
      </div>
      <div class="field">
        <label for="field-sync-sql">SQL для таблицы (вставить в SQL Editor)</label>
        <textarea id="field-sync-sql" class="sql-box" readonly></textarea>
      </div>
      <div class="error" id="sync-error"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="sync-cancel">Отмена</button>
        <button type="submit" class="btn-primary">Сохранить и синхронизировать</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = "finansovyy-uchet-data";
    const SYNC_KEY = "finansovyy-uchet-sync";
    const DEFAULT_SYNC_URL = "https://sqsnhapkgtdjjkiexfrn.supabase.co";
    const DEFAULT_SYNC_KEY = "sb_publishable_2wQo7nf5W4eBQmiPorV9Kg_u-gjFYb-";
    const SYNC_SQL = `create table if not exists public.finance_state (
  id text primary key,
  payload jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.finance_state enable row level security;
drop policy if exists finance_state_public on public.finance_state;
create policy finance_state_public on public.finance_state
  for all using (true) with check (true);
grant all on table public.finance_state to anon, authenticated, public;`;
    const MONTHS = [
      "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
      "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];
    const SPECIAL = {
      "Даня": { hasRental: true, hasDtf: true, hasInvoices: true },
      "Максюшка": { hasRental: true, hasDtf: false, hasInvoices: true }
    };
    const RENTAL_SUBS = ["Коммуналка", "Аренда"];
    const PAYMENT_METHODS = [
      "Наличные",
      "Безналичный расчёт",
      "Услугами",
      "Товарами",
      "Взаимозачёт",
      "Другое"
    ];

    const state = {
      view: "home",
      contractor: null,
      tab: "rental",
      subTab: "Коммуналка",
      paymentFilter: "Все",
      periodMode: "all",
      periodYear: String(new Date().getFullYear()),
      periodMonth: String(new Date().getMonth() + 1),
      editingId: null,
      recordType: "Дебет",
      loanSide: "out",
      pendingDelete: null
    };

    function contractorConfig(name) {
      return SPECIAL[name] || { hasRental: false, hasDtf: false, hasInvoices: false };
    }

    function migrateRecord(record) {
      const r = { ...record };
      if (r.category === "Аренда помещения" && r.subCategory === "Аренда ДТФ") {
        r.category = "Аренда ДТФ";
        r.subCategory = null;
      } else if (r.category === "Аренда помещения" && r.subCategory === "Счета") {
        r.category = "Счета";
        r.subCategory = null;
      }
      if (r.category === "Деньги в долг" && r.loanSide !== "in") r.loanSide = "out";
      return r;
    }

    function defaultData() {
      return {
        contractors: {
          "Даня": { records: [] },
          "Максюшка": { records: [] }
        },
        deletedRecordIds: [],
        deletedContractorNames: []
      };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : defaultData();
        if (!data.contractors) data.contractors = {};
        if (!Array.isArray(data.deletedContractorNames)) data.deletedContractorNames = [];
        const removed = new Set(data.deletedContractorNames);
        if (!removed.has("Даня") && !data.contractors["Даня"]) data.contractors["Даня"] = { records: [] };
        if (!removed.has("Максюшка") && !data.contractors["Максюшка"]) data.contractors["Максюшка"] = { records: [] };
        Object.keys(data.contractors).forEach((name) => {
          if (removed.has(name)) {
            delete data.contractors[name];
            return;
          }
          const list = data.contractors[name].records || [];
          data.contractors[name].records = list.map(migrateRecord);
        });
        return data;
      } catch (err) {
        return defaultData();
      }
    }

    function saveData(data, options) {
      data.updatedAt = Date.now();
      if (!Array.isArray(data.deletedRecordIds)) data.deletedRecordIds = [];
      if (!Array.isArray(data.deletedContractorNames)) data.deletedContractorNames = [];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (!options || !options.skipRemote) schedulePush();
    }

    let db = loadData();
    if (!Array.isArray(db.deletedRecordIds)) db.deletedRecordIds = [];
    if (!Array.isArray(db.deletedContractorNames)) db.deletedContractorNames = [];
    saveData(db, { skipRemote: true });

    const syncState = { status: "busy", message: "Подключение к облаку…" };

    function getSyncConfig() {
      try {
        const raw = localStorage.getItem(SYNC_KEY);
        const cfg = raw ? JSON.parse(raw) : {};
        return {
          url: (cfg.url || DEFAULT_SYNC_URL).replace(/\/$/, ""),
          key: cfg.key || DEFAULT_SYNC_KEY
        };
      } catch (err) {
        return { url: DEFAULT_SYNC_URL, key: DEFAULT_SYNC_KEY };
      }
    }

    function setSyncConfig(cfg) {
      localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
      supabaseClient = null;
    }

    let supabaseClient = null;

    function getSupabase() {
      const { url, key } = getSyncConfig();
      if (!url || !key) return null;
      if (!window.supabase || !window.supabase.createClient) {
        throw new Error("Клиент Supabase не загрузился. Проверьте интернет.");
      }
      if (!supabaseClient) supabaseClient = window.supabase.createClient(url, key);
      return supabaseClient;
    }

    function formatSupabaseError(error) {
      const text = [error?.message, error?.hint, error?.code].filter(Boolean).join(" ");
      if (/finance_state/i.test(text) && /schema cache|does not exist|PGRST205/i.test(text)) {
        return "Таблица finance_state не найдена. Выполните SQL из настроек.";
      }
      return error?.message || text || "Ошибка облака";
    }

    function setSyncStatus(status, message) {
      syncState.status = status;
      syncState.message = message;
      const el = document.getElementById("sync-status");
      if (!el) return;
      el.className = "sync-status " + status;
      el.textContent = message;
    }

    function mergeFinanceData(local, remote) {
      const out = defaultData();
      const deleted = new Set([...(local.deletedRecordIds || []), ...(remote.deletedRecordIds || [])]);
      const deletedNames = new Set([...(local.deletedContractorNames || []), ...(remote.deletedContractorNames || [])]);
      const names = new Set([
        ...Object.keys(local.contractors || {}),
        ...Object.keys(remote.contractors || {})
      ]);
      names.forEach((name) => {
        if (deletedNames.has(name)) return;
        const map = new Map();
        const remoteList = remote.contractors?.[name]?.records || [];
        const localList = local.contractors?.[name]?.records || [];
        remoteList.concat(localList).forEach((rec) => {
          if (!rec || !rec.id || deleted.has(rec.id)) return;
          map.set(rec.id, migrateRecord(rec));
        });
        out.contractors[name] = { records: [...map.values()] };
      });
      if (!deletedNames.has("Даня") && !out.contractors["Даня"]) out.contractors["Даня"] = { records: [] };
      if (!deletedNames.has("Максюшка") && !out.contractors["Максюшка"]) out.contractors["Максюшка"] = { records: [] };
      out.deletedRecordIds = [...deleted];
      out.deletedContractorNames = [...deletedNames];
      out.updatedAt = Date.now();
      return out;
    }

    async function fetchRemote() {
      const client = getSupabase();
      if (!client) return null;
      const { data, error } = await client
        .from("finance_state")
        .select("payload,updated_at")
        .eq("id", "main")
        .maybeSingle();
      if (error) throw new Error(formatSupabaseError(error));
      return data;
    }

    async function pushRemote() {
      const client = getSupabase();
      if (!client) return;
      setSyncStatus("busy", "Сохранение в облако…");
      const { error } = await client.from("finance_state").upsert({
        id: "main",
        payload: db,
        updated_at: new Date().toISOString()
      });
      if (error) throw new Error(formatSupabaseError(error));
      setSyncStatus("ok", "Синхронизировано с облаком");
    }

    let pushTimer = null;
    function schedulePush() {
      if (!getSyncConfig().key) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => {
        pushRemote().catch((err) => setSyncStatus("error", err.message || "Ошибка синхронизации"));
      }, 400);
    }

    async function syncNow() {
      const { key } = getSyncConfig();
      if (!key) {
        setSyncStatus("off", "Синхронизация не настроена");
        openSyncModal();
        return;
      }
      setSyncStatus("busy", "Синхронизация…");
      try {
        const remote = await fetchRemote();
        if (remote && remote.payload) {
          db = mergeFinanceData(db, remote.payload);
          saveData(db, { skipRemote: true });
          render();
        }
        await pushRemote();
        showToast("Данные синхронизированы");
      } catch (err) {
        setSyncStatus("error", err.message || "Ошибка синхронизации");
        showToast("Не удалось синхронизировать");
      }
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMoney(amount) {
      const n = Number(amount) || 0;
      return n.toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " ₽";
    }

    function formatDate(iso) {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      if (!y || !m || !d) return iso;
      return d + "." + m + "." + y;
    }

    function daysBetween(from, to) {
      const a = new Date(from + "T00:00:00");
      const b = new Date(to + "T00:00:00");
      if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return 0;
      return Math.round((b - a) / 86400000);
    }

    function calcProfit(amount, rate, issueDate, returnDate) {
      const sum = Number(amount) || 0;
      const interest = Number(rate) || 0;
      if (!interest || !issueDate) return 0;
      const end = returnDate || todayIso();
      const days = daysBetween(issueDate, end);
      if (days <= 0) return 0;
      return (sum * interest / 100) * (days / 365);
    }

    function todayIso() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function contractorNames() {
      const names = Object.keys(db.contractors || {});
      const special = ["Даня", "Максюшка"].filter((name) => names.includes(name));
      const extras = names
        .filter((name) => name !== "Даня" && name !== "Максюшка")
        .sort((a, b) => a.localeCompare(b, "ru"));
      return [...special, ...extras];
    }

    function currentRecords() {
      return db.contractors[state.contractor]?.records || [];
    }

    function recordYearMonth(record) {
      if (record.year) {
        const monthName = String(record.month || "").split(" ")[0];
        const monthIndex = MONTHS.indexOf(monthName);
        if (monthIndex >= 0) return { year: Number(record.year), month: monthIndex + 1 };
      }
      const iso = record.date || record.issueDate;
      if (!iso || !/^\d{4}-\d{2}/.test(iso)) return null;
      return { year: Number(iso.slice(0, 4)), month: Number(iso.slice(5, 7)) };
    }

    function inSelectedPeriod(record) {
      if (state.periodMode === "all") return true;
      const ym = recordYearMonth(record);
      if (!ym) return false;
      if (Number(ym.year) !== Number(state.periodYear)) return false;
      if (state.periodMode === "month" && Number(ym.month) !== Number(state.periodMonth)) return false;
      return true;
    }

    function periodYears() {
      const years = new Set();
      const now = new Date().getFullYear();
      for (let y = 2020; y <= Math.max(now, 2030); y++) years.add(y);
      currentRecords().forEach((r) => {
        const ym = recordYearMonth(r);
        if (ym && ym.year) years.add(ym.year);
      });
      return [...years].sort((a, b) => b - a);
    }

    function periodRangeLabel() {
      if (state.periodMode === "year") return String(state.periodYear);
      if (state.periodMode === "month") {
        const monthName = MONTHS[Number(state.periodMonth) - 1] || "";
        return `${monthName} ${state.periodYear}`;
      }
      const dates = currentRecords()
        .map((r) => r.date || r.issueDate)
        .filter((d) => d && /^\d{4}-\d{2}-\d{2}$/.test(d))
        .sort();
      if (!dates.length) return "с начала задолженностей по текущую дату";
      return `с ${formatDate(dates[0])} по ${formatDate(todayIso())}`;
    }

    function totals(name, usePeriod) {
      let records = db.contractors[name]?.records || [];
      if (usePeriod) records = records.filter(inSelectedPeriod);
      let debit = 0;
      let credit = 0;
      records.forEach((r) => {
        if (isBorrowed(r)) return;
        if (r.type === "Кредит") credit += Number(r.amount) || 0;
        else debit += Number(r.amount) || 0;
      });
      return { debit, credit, saldo: debit - credit };
    }

    function debitBreakdown(name, usePeriod) {
      let records = db.contractors[name]?.records || [];
      if (usePeriod) records = records.filter(inSelectedPeriod);
      const add = (pred) => records.reduce((sum, r) => {
        if (r.type === "Кредит") return sum;
        return pred(r) ? sum + (Number(r.amount) || 0) : sum;
      }, 0);
      return {
        rent: add((r) => (r.category === "Аренда помещения" && r.subCategory === "Аренда") || r.category === "Аренда ДТФ"),
        utilities: add((r) => r.category === "Аренда помещения" && r.subCategory === "Коммуналка"),
        cash: add((r) => r.category === "Деньги в долг" && r.loanSide !== "in"),
        invoices: add((r) => r.category === "Счета")
      };
    }

    function debitBreakdownRows(split) {
      return [
        ["Всего за аренду", split.rent],
        ["Коммуналка", split.utilities],
        ["Всего по наличным", split.cash],
        ["По счетам", split.invoices]
      ];
    }

    function isBorrowed(r) {
      return r && r.category === "Деньги в долг" && r.loanSide === "in";
    }

    function recordTypeLabel(r) {
      if (r.category !== "Деньги в долг") return r.type;
      if (r.loanSide === "in") return r.type === "Кредит" ? "Вернули" : "Взяли";
      return r.type === "Кредит" ? "Возврат" : "Выдали";
    }

    function interestProfit(name) {
      return (db.contractors[name]?.records || [])
        .filter((r) => r.category === "Деньги в долг" && r.type !== "Кредит" && r.loanSide !== "in")
        .reduce((sum, r) => sum + (Number(r.profit) || 0), 0);
    }

    function interestLoss(name) {
      return (db.contractors[name]?.records || [])
        .filter((r) => isBorrowed(r) && r.type !== "Кредит")
        .reduce((sum, r) => sum + (Number(r.profit) || 0), 0);
    }

    function ourDebt(name) {
      const records = (db.contractors[name]?.records || []).filter(isBorrowed);
      let taken = 0;
      let repaid = 0;
      records.forEach((r) => {
        if (r.type === "Кредит") repaid += Number(r.amount) || 0;
        else taken += Number(r.amount) || 0;
      });
      return taken - repaid;
    }

    function globalDebtAndProfit() {
      let debt = 0;
      let profit = 0;
      let ours = 0;
      let loss = 0;
      contractorNames().forEach((name) => {
        debt += totals(name).saldo;
        profit += interestProfit(name);
        ours += ourDebt(name);
        loss += interestLoss(name);
      });
      return { debt, profit, ours, loss };
    }

    function overdueLoanIds(name) {
      const records = (db.contractors[name]?.records || []).filter((r) => r.category === "Деньги в долг" && r.loanSide !== "in");
      const loans = records
        .filter((r) => r.type !== "Кредит")
        .slice()
        .sort((a, b) => (a.issueDate || a.date || "").localeCompare(b.issueDate || b.date || "") || (a.id || "").localeCompare(b.id || ""));
      let creditLeft = records
        .filter((r) => r.type === "Кредит")
        .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
      const today = todayIso();
      const overdue = new Set();
      loans.forEach((loan) => {
        const amount = Number(loan.amount) || 0;
        const applied = Math.min(creditLeft, amount);
        creditLeft -= applied;
        const unpaid = amount - applied > 0.009;
        if (unpaid && loan.returnDate && loan.returnDate < today) overdue.add(loan.id);
      });
      return overdue;
    }

    function hasOverdueDebt(name) {
      return overdueLoanIds(name).size > 0;
    }

    function saldoTone(amount) {
      if (amount > 0) return "positive";
      if (amount < 0) return "negative";
      return "zero";
    }

    function currentCategory() {
      if (state.tab === "dtf") return "Аренда ДТФ";
      if (state.tab === "invoices") return "Счета";
      if (state.tab === "debt") return "Деньги в долг";
      return "Аренда помещения";
    }

    function availableCategories(name) {
      const cfg = contractorConfig(name);
      const cats = [];
      if (cfg.hasRental) cats.push("Аренда помещения");
      if (cfg.hasDtf) cats.push("Аренда ДТФ");
      if (cfg.hasInvoices) cats.push("Счета");
      cats.push("Деньги в долг");
      return cats;
    }

    function visibleRecords() {
      return currentRecords()
        .filter((r) => {
          if (state.tab === "rental") {
            if (!(r.category === "Аренда помещения" && r.subCategory === state.subTab)) return false;
          } else if (r.category !== currentCategory()) {
            return false;
          }
          if (state.paymentFilter !== "Все" && (r.paymentMethod || "") !== state.paymentFilter) {
            return false;
          }
          if (!inSelectedPeriod(r)) return false;
          return true;
        })
        .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.id || "").localeCompare(a.id || ""));
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function render() {
      const root = document.getElementById("app");
      if (state.view === "home") {
        root.innerHTML = renderHome();
      } else {
        root.innerHTML = renderProfile();
      }
      bindView();
    }

    function renderHome() {
      const totalsAll = globalDebtAndProfit();
      const cards = contractorNames().map((name) => {
        const cfg = contractorConfig(name);
        const t = totals(name);
        const profit = interestProfit(name);
        const loss = interestLoss(name);
        const ours = ourDebt(name);
        const overdue = hasOverdueDebt(name);
        const meta = cfg.hasRental ? "Аренда и займы" : "Только займы";
        const split = cfg.hasRental ? debitBreakdown(name) : null;
        const splitHtml = split ? `
            <div class="card-split">
              <div class="split-head"><span>Дебет</span><strong>${formatMoney(t.debit)}</strong></div>
              ${debitBreakdownRows(split).map(([label, amount]) => (
                `<div class="split-row"><span>${label}</span><b>${formatMoney(amount)}</b></div>`
              )).join("")}
            </div>
        ` : "";
        return `
          <div class="contractor-card-wrap">
          <button class="contractor-card ${overdue ? "overdue" : ""}" data-open="${escapeHtml(name)}">

      return `

    function renderProfile() {

      const t = totals(name, true);
      const allTimeProfit = interestProfit(name);
      const allTimeLoss = interestLoss(name);

      const rows = visibleRecords();

      const tabItems = [];

      if (cfg.hasDtf) tabItems.push(["dtf", "Аренда ДТФ"]);
      if (cfg.hasInvoices) tabItems.push(["invoices", "Счета"]);
      tabItems.push(["debt", "Деньги в долг"]);
      const tabs = `
        <div class="tabs">

      const overdueIds = overdueLoanIds(name);

        <tr class="${overdueIds.has(r.id) ? "overdue-row" : ""}">

          <td>${escapeHtml(r.category)}</td>
          <td>

            ${r.invoiceNumber ? `<span class="cell-extra">№ ${escapeHtml(r.invoiceNumber)}</span>` : ""}
            ${r.issueDate ? `<span class="cell-extra">${isBorrowed(r) ? "получили" : "выдача"} ${formatDate(r.issueDate)}</span>` : ""}
            ${r.returnDate ? `<span class="cell-extra ${overdueIds.has(r.id) ? "overdue-mark" : ""}">вернуть до ${formatDate(r.returnDate)}${overdueIds.has(r.id) ? " · просрочен" : ""}</span>` : (isBorrowed(r) && r.type !== "Кредит" ? `<span class="cell-extra">без срока</span>` : "")}

      const cards = rows.map((r) => `

          <div class="row"><span>${escapeHtml(r.category)}${r.subCategory ? " · " + escapeHtml(r.subCategory) : ""}</span><strong>${formatMoney(r.amount)}</strong></div>
          <div class="row muted"><span>${escapeHtml(r.paymentMethod || "—")}</span><span>${r.category === "Деньги в долг" ? (isBorrowed(r) ? "Потери: " : "Прибыль: ") + formatMoney(r.profit) : (r.month || r.invoiceNumber || "—")}</span></div>
          ${r.returnDate ? `<div class="row ${overdueIds.has(r.id) ? "overdue-mark" : "muted"}"><span>вернуть до ${formatDate(r.returnDate)}${overdueIds.has(r.id) ? " · просрочен" : ""}</span></div>` : (isBorrowed(r) && r.type !== "Кредит" ? `<div class="row muted"><span>без срока возврата</span></div>` : "")}
          ${r.comment ? `<div class="row muted"><span>${escapeHtml(r.comment)}</span></div>` : ""}
          <div class="row muted">
            <span></span>
            <span class="actions">
              <button class="icon-btn" data-edit="${escapeHtml(r.id)}" aria-label="Редактировать">✏️</button>
              <button class="icon-btn danger" data-delete="${escapeHtml(r.id)}" aria-label="Удалить">🗑️</button>
            </span>
          </div>
        </div>
      `).join("");

      const tabRecords = currentRecords().filter((r) => {
        if (state.tab === "rental") return r.category === "Аренда помещения" && r.subCategory === state.subTab;
        return r.category === currentCategory();
      });
      let emptyText = "Записей пока нет";
      if (tabRecords.length && !rows.length) {
        emptyText = state.paymentFilter !== "Все"
          ? "Нет записей с таким способом оплаты"
          : "Нет записей за выбранный период";
      }

      const body = rows.length ? `
        <div class="table-scroll desktop-table">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Категория</th>
                <th>Подкатегория</th>
                <th>Сумма</th>
                <th>Тип</th>
                <th>Прибыль</th>

            <option value="Все" ${state.paymentFilter === "Все" ? "selected" : ""}>Все</option>
            ${PAYMENT_METHODS.map((m) => `<option value="${escapeHtml(m)}" ${state.paymentFilter === m ? "selected" : ""}>${escapeHtml(m)}</option>`).join("")}
          </select>

      `;

      return `
        <div class="topbar">
          <button class="back-btn" id="back-home">← Назад</button>
          <h1>Финансовый учёт</h1>
          <button type="button" class="back-btn" id="delete-contractor" data-delete-contractor="${escapeHtml(name)}">Удалить карточку</button>
        </div>
        <div class="profile-name ${hasOverdueDebt(name) ? "overdue" : ""}">${escapeHtml(name)}</div>
        ${hasOverdueDebt(name) ? `<p class="overdue-mark" style="text-align:center;margin:-12px 0 18px;">Просрочен возврат долга</p>` : ""}
        <div class="analytics">
          <div class="analytics-head">
            <span class="title">Период</span>
            <select id="filter-period-mode">
              <option value="all" ${state.periodMode === "all" ? "selected" : ""}>Весь период</option>
              <option value="year" ${state.periodMode === "year" ? "selected" : ""}>Год</option>
              <option value="month" ${state.periodMode === "month" ? "selected" : ""}>Месяц</option>
            </select>
            <select id="filter-period-year" class="${state.periodMode === "all" ? "hidden" : ""}">
              ${periodYears().map((y) => `<option value="${y}" ${String(y) === String(state.periodYear) ? "selected" : ""}>${y}</option>`).join("")}
            </select>
            <select id="filter-period-month" class="${state.periodMode === "month" ? "" : "hidden"}">
              ${MONTHS.map((label, i) => `<option value="${i + 1}" ${String(i + 1) === String(state.periodMonth) ? "selected" : ""}>${label}</option>`).join("")}
            </select>
          </div>
          <div class="analytics-caption">${escapeHtml(periodRangeLabel())}</div>
        </div>
        <div class="summary">
          <div class="summary-card">
            <div class="label">Дебет</div>
            <div class="value">${formatMoney(t.debit)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Кредит</div>
            <div class="value">${formatMoney(t.credit)}</div>
          </div>
          <div class="summary-card saldo">
            <div class="label">Сальдо</div>
            <div class="value ${saldoTone(t.saldo)}">${formatMoney(t.saldo)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Прибыль за всё время</div>
            <div class="value profit">${formatMoney(allTimeProfit)}</div>
          </div>
          <div class="summary-card saldo">
            <div class="label">Наш долг</div>
            <div class="value ${ours ? "negative" : "zero"}">${formatMoney(ours)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Потери на процентах</div>
            <div class="value loss">${formatMoney(allTimeLoss)}</div>
          </div>
        </div>
        ${split ? `
        <div class="debit-breakdown">
          ${debitBreakdownRows(split).map(([label, amount]) => `
            <div class="item">
              <div class="label">${label}</div>
              <div class="value">${formatMoney(amount)}</div>
            </div>
          `).join("")}
        </div>
        ` : ""}
        ${tabs}
        ${subtabs}
        ${paymentFilter}
        <div class="table-panel">${body}</div>
        <button class="add-record" id="add-record">➕ Добавить запись</button>
      `;
    }

    function bindView() {
      document.getElementById("add-contractor")?.addEventListener("click", openContractorModal);
      document.getElementById("sync-now")?.addEventListener("click", () => { syncNow(); });
      document.getElementById("sync-settings")?.addEventListener("click", openSyncModal);
      document.getElementById("back-home")?.addEventListener("click", () => {
        state.view = "home";
        state.contractor = null;
        render();
      });
      document.getElementById("add-record")?.addEventListener("click", () => openRecordModal());
      document.getElementById("filter-payment")?.addEventListener("change", (e) => {
        state.paymentFilter = e.target.value;
        render();
      });
      document.getElementById("filter-period-mode")?.addEventListener("change", (e) => {
        state.periodMode = e.target.value;
        render();
      });
      document.getElementById("filter-period-year")?.addEventListener("change", (e) => {
        state.periodYear = e.target.value;
        render();
      });
      document.getElementById("filter-period-month")?.addEventListener("change", (e) => {
        state.periodMonth = e.target.value;
        render();
      });

      document.querySelectorAll("[data-open]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const name = btn.getAttribute("data-open");
          openContractor(name);
        });
      });

      document.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.tab = btn.getAttribute("data-tab");
          if (state.tab === "rental" && !RENTAL_SUBS.includes(state.subTab)) {
            state.subTab = "Коммуналка";
          }
          render();
        });
      });

      document.querySelectorAll("[data-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.subTab = btn.getAttribute("data-sub");
          render();
        });
      });

      document.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => openRecordModal(btn.getAttribute("data-edit")));
      });

      document.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", () => askDelete(btn.getAttribute("data-delete")));
      });
      document.querySelectorAll("[data-delete-contractor]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          askDeleteContractor(btn.getAttribute("data-delete-contractor"));
        });
      });
    }

    function openContractor(name) {
      const cfg = contractorConfig(name);
      state.view = "profile";
      state.contractor = name;
      state.tab = cfg.hasRental ? "rental" : "debt";
      state.subTab = "Коммуналка";
      state.paymentFilter = "Все";
      state.periodMode = "all";
      state.periodYear = String(new Date().getFullYear());
      state.periodMonth = String(new Date().getMonth() + 1);
      render();
    }

    function fillSelect(el, items, selected) {
      el.innerHTML = items.map((item) => {
        const value = typeof item === "string" ? item : item.value;
        const label = typeof item === "string" ? item : item.label;
        return `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    function syncRecordFields() {
      const category = document.getElementById("field-category").value;
      const isDebt = category === "Деньги в долг";
      const isInvoice = category === "Счета";
      const isPeriod = category === "Аренда помещения" || category === "Аренда ДТФ";
      const borrowed = isDebt && state.loanSide === "in";

      const isDebtIssue = isDebt && state.recordType !== "Кредит";
      const isDebtRepay = isDebt && state.recordType === "Кредит";

      document.getElementById("category-field").classList.add("hidden");
      document.getElementById("subcategory-field").classList.add("hidden");
      document.getElementById("loanside-field").classList.toggle("hidden", !isDebt);
      document.getElementById("date-field").classList.toggle("hidden", isDebtIssue);
      document.getElementById("date-label").textContent = isDebtRepay
        ? (borrowed ? "Дата возврата" : "Дата погашения")
        : (isInvoice ? "Дата счета" : "Дата");
      document.getElementById("month-field").classList.toggle("hidden", !isPeriod);
      document.getElementById("year-field").classList.toggle("hidden", !isPeriod);
      document.getElementById("invoice-field").classList.toggle("hidden", !isInvoice);
      document.getElementById("comment-field").classList.remove("hidden");
      document.getElementById("payment-field").classList.toggle("hidden", state.recordType !== "Кредит");
      document.getElementById("issue-field").classList.toggle("hidden", !isDebtIssue);
      document.getElementById("issue-label").textContent = borrowed ? "Дата получения" : "Дата выдачи";
      document.getElementById("return-field").classList.toggle("hidden", !isDebtIssue);
      document.getElementById("return-label").textContent = borrowed ? "Срок возврата (необязательно)" : "Срок возврата";
      document.getElementById("rate-field").classList.toggle("hidden", !isDebtIssue);
      document.getElementById("profit-preview").classList.toggle("hidden", !isDebtIssue);
      document.getElementById("side-out").classList.toggle("active", state.loanSide !== "in");
      document.getElementById("side-in").classList.toggle("active", state.loanSide === "in");
      document.getElementById("type-debit").textContent = isDebt ? "Начисление" : "Дебет";
      document.getElementById("type-credit").textContent = isDebt ? "Погашение" : "Кредит";
      updateProfitPreview();
    }

    function updateProfitPreview() {
      const amount = document.getElementById("field-amount").value;
      const rate = document.getElementById("field-rate").value;
      const issue = document.getElementById("field-issue").value;
      const ret = document.getElementById("field-return").value;
      const profit = calcProfit(amount, rate, issue, ret);
      const preview = document.getElementById("profit-preview");
      const borrowed = state.loanSide === "in";
      preview.classList.toggle("loss", borrowed);
      preview.textContent = (borrowed ? "Потери: " : "Прибыль: ") + formatMoney(profit);
    }

    function setRecordType(type) {
      state.recordType = type;
      document.getElementById("type-debit").classList.toggle("active", type === "Дебет");
      document.getElementById("type-credit").classList.toggle("active", type === "Кредит");
      syncRecordFields();
    }

    function setLoanSide(side) {
      state.loanSide = side === "in" ? "in" : "out";
      syncRecordFields();
    }

    function openRecordModal(id) {
      const form = document.getElementById("record-form");
      form.reset();
      document.getElementById("record-error").classList.remove("show");
      state.editingId = id || null;
      document.getElementById("record-title").textContent = id ? "Редактировать запись" : "Добавить запись";

      fillSelect(document.getElementById("field-category"), availableCategories(state.contractor), currentCategory());
      fillSelect(document.getElementById("field-subcategory"), RENTAL_SUBS, state.subTab || "Коммуналка");
      fillSelect(document.getElementById("field-month"), MONTHS, MONTHS[new Date().getMonth()]);
      const years = [];
      for (let y = 2020; y <= 2030; y++) years.push(String(y));
      fillSelect(document.getElementById("field-year"), years, String(new Date().getFullYear()));
      fillSelect(document.getElementById("field-payment"), [
        { value: "", label: "Выберите способ оплаты" },
        ...PAYMENT_METHODS
      ], "");

      document.getElementById("field-date").value = todayIso();
      document.getElementById("field-issue").value = todayIso();
      document.getElementById("field-rate").value = "0";
      state.loanSide = "out";
      setRecordType("Дебет");

      if (id) {
        const rec = currentRecords().find((r) => r.id === id);
        if (rec) {
          document.getElementById("field-category").value = rec.category;
          if (rec.subCategory && RENTAL_SUBS.includes(rec.subCategory)) {
            document.getElementById("field-subcategory").value = rec.subCategory;
          }
          document.getElementById("field-amount").value = rec.amount;
          document.getElementById("field-date").value = rec.date || "";
          state.loanSide = rec.loanSide === "in" ? "in" : "out";
          setRecordType(rec.type || "Дебет");
          if (rec.month) {
            const [monthName, year] = rec.month.split(" ");
            if (MONTHS.includes(monthName)) document.getElementById("field-month").value = monthName;
            if (year) document.getElementById("field-year").value = String(rec.year || year);
          } else if (rec.year) {
            document.getElementById("field-year").value = String(rec.year);
          }
          document.getElementById("field-invoice").value = rec.invoiceNumber || "";
          document.getElementById("field-comment").value = rec.comment || "";
          if (rec.paymentMethod) document.getElementById("field-payment").value = rec.paymentMethod;
          document.getElementById("field-issue").value = rec.issueDate || rec.date || "";
          document.getElementById("field-return").value = rec.returnDate || "";
          document.getElementById("field-rate").value = rec.interestRate ?? 0;
        }
      }

      syncRecordFields();
      document.getElementById("record-overlay").classList.add("open");
      document.getElementById("field-amount").focus();
    }

    function closeRecordModal() {
      document.getElementById("record-overlay").classList.remove("open");
      state.editingId = null;
    }

    function submitRecord(event) {
      event.preventDefault();
      const error = document.getElementById("record-error");
      const amount = Number(document.getElementById("field-amount").value);
      const category = document.getElementById("field-category").value;
      const isDebt = category === "Деньги в долг";
      const isInvoice = category === "Счета";
      const isPeriod = category === "Аренда помещения" || category === "Аренда ДТФ";
      const isCredit = state.recordType === "Кредит";
      const borrowed = isDebt && state.loanSide === "in";
      const issueDate = document.getElementById("field-issue").value || null;
      const returnDate = document.getElementById("field-return").value || null;
      const date = isDebt && !isCredit ? issueDate : document.getElementById("field-date").value;
      if (!document.getElementById("field-amount").value || Number.isNaN(amount) || amount <= 0) {
        error.textContent = "Укажите сумму";
        error.classList.add("show");
        return;
      }
      if (!date) {
        error.textContent = isDebt && !isCredit
          ? (borrowed ? "Укажите дату получения" : "Укажите дату выдачи")
          : (isDebt ? (borrowed ? "Укажите дату возврата" : "Укажите дату погашения") : "Укажите дату");
        error.classList.add("show");
        return;
      }
      if (isDebt && !isCredit && !borrowed && !returnDate) {
        error.textContent = "Укажите срок возврата";
        error.classList.add("show");
        return;
      }
      if (isDebt && !isCredit && returnDate && returnDate < date) {
        error.textContent = "Срок возврата не может быть раньше даты выдачи";
        error.classList.add("show");
        return;
      }
      const paymentMethod = isCredit ? document.getElementById("field-payment").value : null;
      if (isCredit && !paymentMethod) {
        error.textContent = "Укажите способ оплаты";
        error.classList.add("show");
        return;
      }

      const subCategory = category === "Аренда помещения" ? document.getElementById("field-subcategory").value : null;
      const monthName = document.getElementById("field-month").value;
      const year = Number(document.getElementById("field-year").value);
      const interestRate = Number(document.getElementById("field-rate").value) || 0;

      const record = {
        id: state.editingId || uid(),
        category,
        subCategory,
        type: state.recordType,
        amount,
        date,
        month: isPeriod ? `${monthName} ${year}` : null,
        year: isPeriod ? year : null,
        invoiceNumber: isInvoice ? document.getElementById("field-invoice").value.trim() : null,
        paymentMethod,
        comment: document.getElementById("field-comment").value.trim(),
        issueDate: isDebt && !isCredit ? issueDate : null,
        returnDate: isDebt && !isCredit ? returnDate : null,
        interestRate: isDebt && !isCredit ? interestRate : null,
        loanSide: isDebt ? (borrowed ? "in" : "out") : null,
        profit: isDebt && !isCredit ? calcProfit(amount, interestRate, issueDate, returnDate) : 0
      };

      const list = db.contractors[state.contractor].records;
      const idx = list.findIndex((r) => r.id === record.id);
      if (idx >= 0) list[idx] = record;
      else list.push(record);
      saveData(db);
      closeRecordModal();
      render();
      showToast(idx >= 0 ? "Запись обновлена" : "Запись сохранена");
    }

    function askDelete(id) {
      state.pendingDelete = { kind: "record", id };
      document.getElementById("confirm-title").textContent = "Удалить запись?";
      document.getElementById("confirm-text").textContent = "Это действие нельзя отменить.";
      document.getElementById("confirm-overlay").classList.add("open");
    }

    function askDeleteContractor(name) {
      state.pendingDelete = { kind: "contractor", name };
      document.getElementById("confirm-title").textContent = "Удалить карточку?";
      document.getElementById("confirm-text").textContent = "Будут удалены контрагент «" + name + "» и все его записи.";
      document.getElementById("confirm-overlay").classList.add("open");
    }

    function confirmDelete() {
      const pending = state.pendingDelete;
      if (!pending) return;
      if (pending.kind === "contractor") {
        const name = pending.name;
        const records = db.contractors[name]?.records || [];
        db.deletedRecordIds = db.deletedRecordIds || [];
        records.forEach((r) => {
          if (r.id && !db.deletedRecordIds.includes(r.id)) db.deletedRecordIds.push(r.id);
        });
        db.deletedContractorNames = db.deletedContractorNames || [];
        if (!db.deletedContractorNames.includes(name)) db.deletedContractorNames.push(name);
        delete db.contractors[name];
        saveData(db);
        state.pendingDelete = null;
        document.getElementById("confirm-overlay").classList.remove("open");
        if (state.contractor === name) {
          state.view = "home";
          state.contractor = null;
        }
        render();
        showToast("Карточка удалена");
        return;
      }
      const id = pending.id;
      if (!id) return;
      db.deletedRecordIds = db.deletedRecordIds || [];
      if (!db.deletedRecordIds.includes(id)) db.deletedRecordIds.push(id);
      db.contractors[state.contractor].records = currentRecords().filter((r) => r.id !== id);
      saveData(db);
      state.pendingDelete = null;
      document.getElementById("confirm-overlay").classList.remove("open");
      render();
      showToast("Запись удалена");
    }

    function openContractorModal() {
      document.getElementById("contractor-form").reset();
      document.getElementById("contractor-error").classList.remove("show");
      document.getElementById("contractor-overlay").classList.add("open");
      document.getElementById("field-contractor-name").focus();
    }

    function closeContractorModal() {
      document.getElementById("contractor-overlay").classList.remove("open");
    }

    function openSyncModal() {
      const cfg = getSyncConfig();
      document.getElementById("field-sync-url").value = cfg.url || DEFAULT_SYNC_URL;
      document.getElementById("field-sync-key").value = cfg.key || "";
      document.getElementById("field-sync-sql").value = SYNC_SQL;
      document.getElementById("sync-error").classList.remove("show");
      document.getElementById("sync-overlay").classList.add("open");
      document.getElementById("field-sync-key").focus();
    }

    function closeSyncModal() {
      document.getElementById("sync-overlay").classList.remove("open");
    }

    async function submitSync(event) {
      event.preventDefault();
      const error = document.getElementById("sync-error");
      const url = document.getElementById("field-sync-url").value.trim().replace(/\/$/, "");
      const key = document.getElementById("field-sync-key").value.trim();
      if (!url || !key) {
        error.textContent = "Укажите адрес проекта и ключ anon";
        error.classList.add("show");
        return;
      }
      setSyncConfig({ url, key });
      closeSyncModal();
      await syncNow();
    }

    function submitContractor(event) {
      event.preventDefault();
      const error = document.getElementById("contractor-error");
      const name = document.getElementById("field-contractor-name").value.trim();
      if (!name) {
        error.textContent = "Введите имя контрагента";
        error.classList.add("show");
        return;
      }
      if (db.contractors[name]) {
        error.textContent = "Контрагент с таким именем уже существует";
        error.classList.add("show");
        return;
      }
      db.deletedContractorNames = (db.deletedContractorNames || []).filter((n) => n !== name);
      db.contractors[name] = { records: [] };
      saveData(db);
      closeContractorModal();
      render();
      showToast("Контрагент добавлен");
    }

    function closeOverlays() {
      closeRecordModal();
      closeContractorModal();
      closeSyncModal();
      document.getElementById("confirm-overlay").classList.remove("open");
      state.pendingDelete = null;
    }

    document.getElementById("record-form").addEventListener("submit", submitRecord);
    document.getElementById("record-cancel").addEventListener("click", closeRecordModal);
    document.getElementById("field-category").addEventListener("change", () => {
      if (document.getElementById("field-category").value === "Аренда помещения") {
        fillSelect(document.getElementById("field-subcategory"), RENTAL_SUBS, state.subTab || "Коммуналка");
      }
      syncRecordFields();
    });
    document.getElementById("field-subcategory").addEventListener("change", syncRecordFields);
    ["field-amount", "field-rate", "field-issue", "field-return"].forEach((id) => {
      document.getElementById(id).addEventListener("input", updateProfitPreview);
    });
    document.getElementById("type-debit").addEventListener("click", () => setRecordType("Дебет"));
    document.getElementById("type-credit").addEventListener("click", () => setRecordType("Кредит"));
    document.getElementById("side-out").addEventListener("click", () => setLoanSide("out"));
    document.getElementById("side-in").addEventListener("click", () => setLoanSide("in"));
    document.getElementById("contractor-form").addEventListener("submit", submitContractor);
    document.getElementById("contractor-cancel").addEventListener("click", closeContractorModal);
    document.getElementById("sync-form").addEventListener("submit", submitSync);
    document.getElementById("sync-cancel").addEventListener("click", closeSyncModal);
    document.getElementById("sync-overlay").addEventListener("click", (e) => {
      if (e.target.id === "sync-overlay") closeSyncModal();
    });
    document.getElementById("confirm-cancel").addEventListener("click", () => {
      document.getElementById("confirm-overlay").classList.remove("open");
      state.pendingDelete = null;
    });
    document.getElementById("confirm-ok").addEventListener("click", confirmDelete);
    document.getElementById("record-overlay").addEventListener("click", (e) => {
      if (e.target.id === "record-overlay") closeRecordModal();
    });
    document.getElementById("contractor-overlay").addEventListener("click", (e) => {
      if (e.target.id === "contractor-overlay") closeContractorModal();
    });
    document.getElementById("confirm-overlay").addEventListener("click", (e) => {
      if (e.target.id === "confirm-overlay") {
        document.getElementById("confirm-overlay").classList.remove("open");
        state.pendingDelete = null;
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeOverlays();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && getSyncConfig().key) syncNow();
    });

    render();
    if (getSyncConfig().key) {
      setSyncStatus("busy", "Синхронизация…");
      syncNow();
    }
  </script>
</body>
</html>
