<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Финансовый учёт</title>
  <style>
    :root {
      --bg-start: #0a1628;
      --bg-end: #121f3a;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --text-secondary: #b0c4de;
      --accent: #4a9eff;
      --accent-soft: rgba(74, 158, 255, 0.18);
      --debit: #6ec8ff;
      --credit: #f0a070;
      --danger: #ff7b7b;
      --saldo-plus: #5ee9a3;
      --saldo-minus: #ff6b6b;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      line-height: 1.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(900px 500px at 12% -10%, rgba(74, 158, 255, 0.16), transparent 55%),
        radial-gradient(700px 420px at 100% 0%, rgba(110, 200, 255, 0.08), transparent 50%);
      z-index: 0;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1560px;
      margin: 0 auto;
      padding: 28px 28px 48px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .topbar h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      flex: 1;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      color: var(--text-secondary);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: background 0.3s, color 0.3s, transform 0.3s;
    }

    .back-btn:hover {
      background: var(--card-hover);
      color: var(--text);
      transform: translateX(-2px);
    }

    .hero {
      text-align: center;
      margin: 24px 0 32px;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin-top: 8px;
      color: var(--text-secondary);
    }

    .sync-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 8px;
    }

    .sync-status {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .sync-status.ok { color: var(--saldo-plus); }
    .sync-status.error { color: var(--saldo-minus); }
    .sync-status.busy { color: var(--debit); }

    .sync-btn {
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text-secondary);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: background 0.3s, color 0.3s;
    }

    .sync-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .sql-box {
      width: 100%;
      min-height: 140px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .home-totals {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 0 0 24px;
    }

    .home-totals .summary-card .value {
      white-space: nowrap;
    }

    .home-totals .summary-card .value.profit {
      color: var(--saldo-plus);
    }

    .home-totals .summary-card .value.loss,
    .summary-card .value.loss,
    .card-stats .stat-value.loss {
      color: var(--saldo-minus);
    }

    .contractor-card-wrap {
      position: relative;
      min-width: 0;
    }

    .contractor-card-wrap .contractor-card {
      width: 100%;
      height: 100%;
    }

    .card-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1;
    }

    .card-delete:hover {
      background: rgba(255, 107, 107, 0.25);
      color: var(--danger);
    }

    .contractors {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .contractor-card,
    .add-contractor {
      min-height: 180px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 22px 16px 18px;
      transition: transform 0.3s, background 0.3s, border-color 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .contractor-card:hover,
    .add-contractor:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    .contractor-card .icon,
    .add-contractor .icon {
      font-size: 2.2rem;
    }

    .contractor-card .name {
      font-size: 1.25rem;
      font-weight: 650;
    }

    .contractor-card .meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .card-stats .stat {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }

    .card-stats .stat-label {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .card-stats .stat-value {
      font-size: 0.92rem;
      font-weight: 700;
      margin-top: 3px;
      white-space: nowrap;
    }

    .card-split {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .card-split .split-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .card-split .split-head strong {
      color: var(--debit);
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-split .split-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .card-split .split-row span {
      white-space: normal;
      min-width: 0;
    }

    .card-split .split-row b {
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .debit-breakdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: -10px 0 24px;
    }

    .debit-breakdown .item {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .debit-breakdown .item .label {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .debit-breakdown .item .value {
      font-size: 1rem;
      font-weight: 650;
      color: var(--debit);
      white-space: nowrap;
    }

    .contractor-card.overdue {
      border-color: rgba(255, 107, 107, 0.55);
      box-shadow: 0 8px 32px rgba(255, 80, 80, 0.2);
      background: rgba(255, 107, 107, 0.08);
    }

    .contractor-card.overdue .name,
    .profile-name.overdue,
    .overdue-mark,
    .cell-extra.overdue-mark {
      color: var(--saldo-minus);
    }

    .contractor-card .overdue-mark {
      font-size: 0.82rem;
      font-weight: 650;
    }

    tr.overdue-row td {
      background: rgba(255, 107, 107, 0.08);
    }

    .record-card.overdue-row {
      border: 1px solid rgba(255, 107, 107, 0.35);
    }

    tr.paid-row td {
      background: rgba(94, 233, 163, 0.12);
    }

    .record-card.paid-row {
      border: 1px solid rgba(94, 233, 163, 0.45);
      background: rgba(94, 233, 163, 0.08);
    }

    .remain-open { color: var(--debit); font-weight: 650; }
    .remain-paid { color: var(--saldo-plus); font-weight: 650; }
    .remain-overdue { color: var(--saldo-minus); font-weight: 650; }

    .payments-panel {
      margin: 4px 0 16px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .payments-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .payments-head span {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .payment-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.92rem;
    }

    .payment-item .meta {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .pay-inline {
      margin-top: 12px;
    }

    .pay-inline .btn-primary {
      width: 100%;
      margin-top: 4px;
    }

    .text-btn {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(94, 233, 163, 0.14);
      color: var(--saldo-plus);
      font-size: 0.82rem;
      font-weight: 650;
    }

    .text-btn:hover {
      background: rgba(94, 233, 163, 0.22);
    }

    .saldo-positive { color: var(--saldo-plus); }
    .saldo-negative { color: var(--saldo-minus); }

    .add-contractor {
      border: 1px dashed rgba(74, 158, 255, 0.45);
      color: var(--debit);
      justify-content: center;
    }

    .profile-name {
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      font-weight: 750;
      margin: 8px 0 24px;
      letter-spacing: -0.03em;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .summary-card .label {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: clamp(1.05rem, 2.4vw, 1.65rem);
      font-weight: 700;
      color: var(--debit);
      white-space: nowrap;
    }

    .summary-card .value.profit {
      color: var(--saldo-plus);
    }

    .summary-card.saldo .value.positive {
      color: var(--saldo-plus);
    }

    .summary-card.saldo .value.negative {
      color: var(--saldo-minus);
    }

    .summary-card.saldo .value.zero {
      color: var(--text);
    }

    .tabs, .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab, .subtab {
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.3s, color 0.3s, border-color 0.3s, transform 0.3s;
    }

    .tab.active, .subtab.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: rgba(74, 158, 255, 0.45);
    }

    .tab:hover, .subtab:hover {
      transform: translateY(-1px);
      color: var(--text);
    }

    .tab.paid-tab {
      border-color: rgba(94, 233, 163, 0.28);
    }

    .tab.paid-tab.active {
      background: rgba(94, 233, 163, 0.16);
      color: var(--saldo-plus);
      border-color: rgba(94, 233, 163, 0.45);
    }

    .tab-count {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .tab.paid-tab.active .tab-count {
      background: rgba(94, 233, 163, 0.2);
    }

    .table-panel {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    td.wrap {
      white-space: normal;
      max-width: 200px;
    }

    .analytics {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .analytics-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
    }

    .analytics-head .title {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .analytics-head select {
      min-width: 160px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      outline: none;
    }

    .analytics-head select option {
      background: #121f3a;
      color: #fff;
    }

    .analytics-caption {
      margin-top: 10px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .table-toolbar .toolbar-left,
    .table-toolbar .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .table-toolbar input[type="search"] {
      min-width: 220px;
      flex: 1;
      max-width: 360px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      outline: none;
    }

    .collapse-btn {
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    .collapse-btn:hover {
      background: var(--card-hover);
    }

    .table-toolbar label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .table-toolbar select {
      min-width: 220px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      outline: none;
    }

    .table-toolbar select option {
      background: #121f3a;
      color: #fff;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      white-space: nowrap;
    }

    th {
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 600;
    }

    td.muted {
      color: var(--text-secondary);
    }

    .type-debit { color: var(--debit); font-weight: 600; }
    .type-credit { color: var(--credit); font-weight: 600; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      transition: background 0.3s, transform 0.3s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .icon-btn.danger:hover {
      background: rgba(255, 123, 123, 0.18);
    }

    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .add-record {
      width: 100%;
      padding: 16px;
      margin: 0 0 12px;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      box-shadow: var(--shadow);
      transition: transform 0.3s, filter 0.3s;
    }

    .records-head {
      margin: 8px 0 0;
    }

    .add-record:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .mobile-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .record-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 14px;
    }

    .record-card .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .record-card .row:last-child {
      margin-bottom: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 22, 0.72);
      backdrop-filter: blur(6px);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.open {
      display: flex;
    }

    #confirm-overlay {
      z-index: 30;
    }

    .modal {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(18, 31, 58, 0.96), rgba(10, 22, 40, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .modal h2 {
      font-size: 1.25rem;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      background: rgba(74, 158, 255, 0.08);
    }

    .field select option {
      background: #121f3a;
      color: #fff;
    }

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .type-toggle button {
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .type-toggle button.active.debit {
      background: rgba(110, 200, 255, 0.16);
      color: var(--debit);
      border-color: rgba(110, 200, 255, 0.4);
    }

    .type-toggle button.active.credit {
      background: rgba(240, 160, 112, 0.16);
      color: var(--credit);
      border-color: rgba(240, 160, 112, 0.4);
    }

    .profit-preview {
      margin: 4px 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--debit);
      font-weight: 650;
    }

    .profit-preview.loss {
      background: rgba(255, 107, 107, 0.12);
      color: var(--saldo-minus);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 650;
      transition: transform 0.3s, filter 0.3s, background 0.3s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
